<main class="mx-auto w-full max-w-2xl flex-1 px-4 py-8">
  <div class="flex flex-col items-center gap-4 text-center">
    <img src="icons/icon-192x192.png" [alt]="'app.name' | t" class="size-20" width="80" height="80" />
    <h1 class="text-2xl font-semibold">{{ 'app.name' | t }}</h1>
    <p class="text-callout max-w-md leading-relaxed opacity-60">{{ 'about.description' | t }}</p>
  </div>
</main>
