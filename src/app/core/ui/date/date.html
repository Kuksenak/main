<div class="inline-flex w-auto flex-col gap-1.5">

  @if (isMobile()) {
    <!-- Mobile: native date picker -->
    <input
      type="date"
      [value]="nativeValue()"
      [disabled]="disabled"
      (change)="onNativeChange($event)"
      class="chip"
    >
  } @else {
    <!-- Desktop: custom iOS-style calendar via CDK overlay -->
    <button
     
      type="button"
      cdkOverlayOrigin
      #origin="cdkOverlayOrigin"
      [disabled]="disabled"
      (click)="toggle()"
      class="chip"
    >
      <span [class.opacity-40]="!value()">{{ triggerLabel() }}</span>
    </button>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayPositions]="positions"
      [cdkConnectedOverlayOrigin]="origin"
      [cdkConnectedOverlayOpen]="isOpen()"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="close()"
      (detach)="close()"
    >
      <!-- The new style (as the schedule's month): the month at the left, ‹ › at the right; the chosen
           day a dark circle, today in blue -->
      <div class="pick-panel w-[15.5rem] !p-2">
        <div class="mb-1 flex items-center gap-0.5 pl-1.5">
          <span class="flex-1 text-[0.875rem] font-medium">{{ monthLabel() }}</span>
          <button type="button" (click)="prevMonth()" [attr.aria-label]="'picker.prevMonth' | t" class="head-btn !h-7 !px-1"><app-icon name="chevron-left" class="!size-4" /></button>
          <button type="button" (click)="nextMonth()" [attr.aria-label]="'picker.nextMonth' | t" class="head-btn !h-7 !px-1"><app-icon name="chevron-right" class="!size-4" /></button>
        </div>
        <div class="grid grid-cols-7">
          @for (wd of weekdays(); track $index) {
            <div class="flex h-7 items-center justify-center text-[0.75rem] opacity-45">{{ wd }}</div>
          }
        </div>
        @for (week of weeks(); track $index) {
          <div class="grid grid-cols-7">
            @for (cell of week; track cell.date.getTime()) {
              <div class="flex items-center justify-center">
                <button type="button" (click)="selectDay(cell)" class="pick-day" [class.opacity-35]="!cell.inMonth" [class.is-on]="isSelected(cell.date)" [class.is-now]="isToday(cell.date)">{{ cell.date.getDate() }}</button>
              </div>
            }
          </div>
        }
      </div>
    </ng-template>
  }
</div>
