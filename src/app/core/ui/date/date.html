<div class="inline-flex w-auto flex-col gap-1.5">
  @if (label) {
    <span class="text-sm opacity-70">{{ label }}</span>
  }

  @if (isMobile()) {
    <!-- Mobile: native date picker -->
    <input
      type="date"
      [value]="nativeValue()"
      [disabled]="disabled"
      (change)="onNativeChange($event)"
      class="chip"
    >
  } @else {
    <!-- Desktop: custom iOS-style calendar via CDK overlay -->
    <button
      #trigger
      type="button"
      cdkOverlayOrigin
      #origin="cdkOverlayOrigin"
      [disabled]="disabled"
      (click)="toggle(trigger)"
      class="chip"
    >
      <span [class.opacity-40]="!value()">{{ triggerLabel() }}</span>
    </button>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="origin"
      [cdkConnectedOverlayOpen]="isOpen()"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="close()"
      (detach)="close()"
    >
      <div class="popover-panel mt-1.5 w-[300px] p-3">

        <!-- Header: month nav -->
        <div class="flex items-center justify-between mb-2">
          <button type="button" (click)="prevMonth()" [attr.aria-label]="'picker.prevMonth' | t"
            class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[var(--highlight)] transition-[transform,background-color] active:scale-[0.96] [-webkit-tap-highlight-color:transparent]">
            <app-icon name="chevron-left" [strokeWidth]="2.5" class="size-4 opacity-70" />
          </button>
          <span class="text-[15px] font-semibold text-balance">{{ monthLabel() }}</span>
          <button type="button" (click)="nextMonth()" [attr.aria-label]="'picker.nextMonth' | t"
            class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[var(--highlight)] transition-[transform,background-color] active:scale-[0.96] [-webkit-tap-highlight-color:transparent]">
            <app-icon name="chevron-right" [strokeWidth]="2.5" class="size-4 opacity-70" />
          </button>
        </div>

        <!-- Weekday labels -->
        <div class="grid grid-cols-7 mb-1">
          @for (wd of weekdays(); track $index) {
            <div class="h-8 flex items-center justify-center text-xs font-medium opacity-40">{{ wd }}</div>
          }
        </div>

        <!-- Days -->
        @for (week of weeks(); track $index) {
          <div class="grid grid-cols-7">
            @for (cell of week; track cell.date.getTime()) {
              <div class="flex items-center justify-center py-0.5">
                <button
                  type="button"
                  (click)="selectDay(cell)"
                  class="w-10 h-10 rounded-full text-[15px] tabular-nums flex items-center justify-center transition-[transform,background-color] active:scale-[0.96] [-webkit-tap-highlight-color:transparent]"
                  [class.opacity-30]="!cell.inMonth"
                  [class]="isSelected(cell.date)
                    ? 'option-selected'
                    : isToday(cell.date)
                      ? 'option option-current'
                      : 'option'"
                >
                  {{ cell.date.getDate() }}
                </button>
              </div>
            }
          </div>
        }
      </div>
    </ng-template>
  }
</div>
