<!-- (outside it: a click closes it; nothing dims) -->
<div class="fixed inset-0 z-50 flex items-start justify-center pt-[8vh]" (mousedown)="closed.emit()">
  <div
    role="dialog"
    aria-modal="true"
    class="flex max-h-[76vh] w-[37.5rem] max-w-[92vw] animate-menu-in flex-col overflow-hidden rounded-[1.25rem] border-[0.5px] border-separator
           bg-dialog text-fg shadow-popover"
    (mousedown)="$event.stopPropagation()"
  >
    <!-- The field, its loupe at the left -->
    <div class="flex h-12 shrink-0 items-center gap-3 px-4.5">
      <app-icon name="search" class="size-5 shrink-0 text-icon" />
      <input
        #field
        type="text"
        autocomplete="off"
        [value]="query()"
        (input)="query.set(field.value)"
        (keydown)="key($event)"
        [placeholder]="placeholder()"
        class="min-w-0 flex-1 bg-transparent text-base text-fg outline-none placeholder:text-fg-secondary"
      />
    </div>

    <!-- The results by section (its name small and gray over its first one); the picked one gray -->
    <div #list role="listbox" class="flex min-h-0 flex-1 flex-col overflow-y-auto px-3.5 pt-1 pb-2">
      @for (result of results(); track result.section + result.id; let i = $index) {
        @if (i === 0 || results()[i - 1].section !== result.section) {
          <p class="px-2 pt-3 pb-1.5 text-footnote font-medium text-fg-secondary">{{ result.section }}</p>
        }
        <button
          type="button"
          role="option"
          [attr.aria-selected]="i === index()"
          (click)="picked.emit(result)"
          (mouseenter)="index.set(i)"
          class="flex min-h-9 w-full shrink-0 items-center gap-2.5 rounded-xl px-2 py-1 text-left active:transform-none aria-selected:bg-tint"
        >
          <app-icon [name]="result.icon" colored class="size-5 shrink-0 text-icon" />
          <!-- (the name, then its hint after a dash, small and gray, as Notion's) -->
          <span class="min-w-0 flex-1 truncate text-ui text-side-text">
            {{ result.label }}
            @if (result.hint) {
              <span class="text-footnote text-fg-secondary"> — {{ result.hint }}</span>
            }
          </span>
        </button>
      } @empty {
        <p class="m-auto py-10 text-center text-ui text-fg-secondary">{{ empty() }}</p>
      }
    </div>

    <!-- The keys, at the bottom, under a hairline -->
    <div class="flex h-11 shrink-0 items-center gap-5 border-t-[0.5px] border-separator px-5 text-footnote text-fg-secondary">
      <span class="flex items-center gap-1.5"><kbd class="font-sans">Esc</kbd>{{ keys()[0] }}</span>
      <span class="flex items-center gap-1.5"><kbd class="flex"><app-icon name="arrow-up" class="size-4" /><app-icon name="arrow-down" class="size-4" /></kbd>{{ keys()[1] }}</span>
      <span class="flex items-center gap-1.5"><kbd class="flex"><app-icon name="enter" class="size-4" /></kbd>{{ keys()[2] }}</span>
    </div>
  </div>
</div>
