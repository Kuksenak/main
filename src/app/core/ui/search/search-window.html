<!-- (the shared window: near the top, Esc or a click outside closes it) -->
<ui-window (closed)="closed.emit()">
  <!-- The field, its loupe at the left -->
  <ui-window-head icon="search">
    <input
      #field
      uiWindowField
      uiListKeys
      [count]="results().length"
      [(index)]="index"
      (chosen)="picked.emit(results()[$event])"
      [value]="query()"
      (input)="query.set(field.value)"
      [placeholder]="placeholder()"
    />
  </ui-window-head>

  <!-- The results by section (its name small and gray over its first one); the picked one gray -->
  <ui-window-list role="listbox">
    @for (result of results(); track result.section + result.id; let i = $index) {
      @if (i === 0 || results()[i - 1].section !== result.section) {
        <ui-window-section>{{ result.section }}</ui-window-section>
      }
      <!-- (the name, then its hint after a dash, small and gray, as Notion's) -->
      <button
        type="button"
        uiRow
        [hover]="false"
        [icon]="result.icon"
        [hint]="result.hint"
        role="option"
        [attr.aria-selected]="i === index()"
        (click)="picked.emit(result)"
        (mouseenter)="index.set(i)"
      >
        {{ result.label }}
      </button>
    } @empty {
      <ui-empty class="m-auto">{{ empty() }}</ui-empty>
    }
  </ui-window-list>

  <!-- The keys, at the bottom, under a hairline -->
  <ui-window-foot>
    <ui-window-keys [enter]="enter()" />
  </ui-window-foot>
</ui-window>
