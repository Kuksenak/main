<!-- By the button that asked (no dimming), as iOS's on both devices: a panel (phones: glass; desktops:
     the menus' gray), the question, the answers round buttons one under another (none: a click
     outside, Esc) -->
<div
  role="alertdialog"
  class="fixed flex w-72 max-w-[calc(100vw-1rem)] animate-menu-in flex-col gap-1.5 text-fg
         mobile:rounded-[1.75rem] mobile:glass mobile:p-2
         desktop:rounded-menu desktop:bg-menu desktop:p-1.5 desktop:shadow-menu"
  [style.top.px]="place().top"
  [style.bottom.px]="place().bottom"
  [style.left.px]="place().left"
  (click)="$event.stopPropagation()"
>
  <p class="pt-2 pb-1 leading-snug text-balance mobile:px-3 mobile:text-body desktop:px-2.5 desktop:text-ui">{{ text() }}</p>
  @for (c of choices(); track c.value) {
    <button
      type="button"
      class="rounded-full bg-tint px-4 text-center font-medium leading-tight hover:bg-tint-strong active:bg-tint-strong
             mobile:min-h-11 mobile:py-2 mobile:text-body desktop:min-h-8 desktop:rounded-menu-row desktop:py-1.5 desktop:text-ui"
      [class.text-danger]="c.danger"
      (click)="answer(c.value)"
    >
      {{ c.label }}
    </button>
  }
</div>
