<ng-content select="ui-avatar" />
@if (icon(); as name) {

}
<span class="max-w-button-label overflow-hidden text-ellipsis empty:hidden"><ng-content /></span>

  <app-icon name="chevron-down" class="-ml-0.5 size-[calc(var(--icon-ui)*0.875)] opacity-50" />
}
