<!-- (outside it: a tap closes it; nothing dims) -->
<div class="absolute inset-0" (click)="close()"></div>

<div
  role="dialog"
  aria-modal="true"
  class="absolute inset-x-2 flex animate-sheet-up flex-col overflow-hidden rounded-[2.75rem] border-[0.5px] border-sheet-border bg-sheet
         text-fg shadow-sheet backdrop-blur-[30px] backdrop-saturate-[180%] [corner-shape:squircle]"
  [class.bottom-2]="!inBrowser"
  [class.bottom-6]="inBrowser"
  [class.max-h-[calc(var(--app-h)*0.9)]]="!tall()"
  [class.top-[calc(env(safe-area-inset-top)+0.375rem)]]="tall()"
  [style.transform]="closing() ? 'translateY(calc(100% + 1rem))' : dragY() ? 'translateY(' + dragY() + 'px)' : null"
  [style.transition]="dragging() ? 'none' : closing() ? 'transform 360ms cubic-bezier(0.4, 0, 0.2, 1)' : 'transform 280ms var(--ease-ios)'"
>
  <!-- The grabber: drag it (or the top) down -->
  <div
    class="shrink-0 touch-none px-4 pt-2 pb-2.5"
    (touchstart)="dragStart($event)"
    (touchmove)="dragMove($event)"
    (touchend)="dragEnd()"
    (touchcancel)="dragEnd()"
  >
    <div class="mx-auto h-1.25 w-9 rounded-full bg-grabber"></div>
  </div>

  <div class="flex min-h-0 flex-1 flex-col overflow-y-auto overscroll-contain px-3 pt-1 pb-[max(1rem,env(safe-area-inset-bottom))]">
    <ng-content />
  </div>
</div>
