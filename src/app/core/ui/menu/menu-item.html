@if (icon(); as name) {
  @if (danger()) {
    <app-icon [name]="name" class="size-icon-menu" />
  } @else {
    <app-icon [name]="name" colored class="size-icon-menu text-icon" />
  }
}
<span class="min-w-0 flex-1 truncate"><ng-content /></span>
@if (checked()) {
  <app-icon name="check" class="size-icon-menu" />
}
