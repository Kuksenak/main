@if (icon(); as name) {
  @if (danger()) {
    <!-- (a danger one: the soft gray of the rest, its color under the pointer) -->
    <app-icon [name]="name" class="size-icon-menu text-icon group-hover:text-current group-focus-visible:text-current" />
  } @else {
    <app-icon [name]="name" colored class="size-icon-menu text-icon" />
  }
}
<span class="min-w-0 flex-1 truncate"><ng-content /></span>
@if (checked()) {
  <app-icon name="check" class="size-icon-menu" />
}
