<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin()"
  [cdkConnectedOverlayOpen]="true"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="close()"
  (overlayKeydown)="key($event)"
  (attach)="focus(0)"
>
  <div
    role="menu"
    [attr.data-narrow]="narrow() ? '' : null"
    class="flex min-w-menu max-w-[calc(100vw-1rem)] data-narrow:min-w-48 animate-menu-in flex-col rounded-[1.375rem] border-[0.5px] border-separator bg-dialog p-1.5 text-fg shadow-popover"
    (click)="picked($event)"
  >
    <ng-content />
  </div>
</ng-template>
