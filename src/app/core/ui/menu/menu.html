<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin()"
  [cdkConnectedOverlayOpen]="true"
  [cdkConnectedOverlayPositions]="side() ? sidePositions : positions"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8"
  [cdkConnectedOverlayHasBackdrop]="!side()"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="close()"
  (overlayKeydown)="key($event)"
  (attach)="focus(0)"
>
  <div
    role="menu"
    [attr.data-narrow]="narrow() ? '' : null"
    class="flex min-w-menu max-w-[calc(100vw-1rem)] data-narrow:min-w-48 animate-menu-in flex-col rounded-[1.25rem] bg-menu p-1.5 text-fg shadow-menu backdrop-blur-2xl backdrop-saturate-[180%]"
    (click)="picked($event)"
  >
    <ng-content />
  </div>
</ng-template>
