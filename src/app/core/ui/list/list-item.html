@if (icon(); as name) {
  <app-icon [name]="name" class="size-icon-menu shrink-0 text-icon group-data-danger:text-danger" />
}
<span class="min-w-0 flex-1 truncate"><ng-content /></span>
<ng-content select="[itemValue]" />
@if (checked()) {
  <app-icon name="check" class="size-5 shrink-0 text-accent" />
}
@if (chevron()) {
  <app-icon name="chevron-right" class="size-5 shrink-0 opacity-30" />
}
