<div class="inline-flex w-auto flex-col gap-1.5">
  @if (label) {
    <span class="text-sm opacity-70">{{ label }}</span>
  }

  @if (isMobile()) {
    <!-- Mobile: native time picker -->
    <input
      type="time"
      [value]="value() ?? ''"
      [disabled]="disabled"
      (change)="onNativeChange($event)"
      class="appearance-none border-0 px-2.5 py-1 rounded-lg sm:rounded-md bg-black/[0.04] dark:bg-white/[0.06] text-[17px] tabular-nums [font-family:-apple-system,BlinkMacSystemFont,'SF_Pro_Text',system-ui,sans-serif] focus:outline-none [-webkit-tap-highlight-color:transparent] disabled:opacity-40"
    >
  } @else {
    <!-- Desktop: custom iOS-style time picker via CDK overlay -->
    <button
      #trigger
      type="button"
      cdkOverlayOrigin
      #origin="cdkOverlayOrigin"
      [disabled]="disabled"
      (click)="toggle(trigger)"
      (keydown)="onKeydown($event)"
      class="inline-flex w-auto items-center px-2.5 py-1 rounded-lg sm:rounded-md bg-black/[0.04] dark:bg-white/[0.06] text-[15px] text-left whitespace-nowrap focus:outline-none [-webkit-tap-highlight-color:transparent] disabled:opacity-40 hover:bg-black/5 dark:hover:bg-white/10 transition-colors"
    >
      <span class="tabular-nums text-[15px] [font-family:-apple-system,BlinkMacSystemFont,'SF_Pro_Text',system-ui,sans-serif]" [class.opacity-40]="!value()">{{ triggerLabel() }}</span>
    </button>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="origin"
      [cdkConnectedOverlayOpen]="isOpen()"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (attach)="onOpened()"
      (backdropClick)="close()"
      (detach)="close()"
    >
      <div class="mt-1.5 p-2 w-[180px] rounded-xl bg-[var(--surface)] overflow-hidden
                  origin-top [animation:dropdownIn_160ms_cubic-bezier(0.2,0,0,1)]
                  shadow-[0_8px_30px_rgba(0,0,0,0.18)] dark:shadow-[0_8px_30px_rgba(0,0,0,0.6)]">

        <div class="flex gap-1">
          <!-- Hours -->
          <div #hourCol (scroll)="onColScroll(hourCol)" class="relative flex-1 flex flex-col gap-0.5 max-h-60 overflow-y-auto">
            @for (h of loopHours(); track $index) {
              <button
                type="button"
                (click)="selectHour(h)"
                [attr.data-active]="activeHour() === h ? '' : null"
                class="w-full py-1.5 rounded-lg text-[15px] tabular-nums text-center transition-[transform,background-color] active:scale-[0.96] [-webkit-tap-highlight-color:transparent]"
                [class]="hourClass(h)"
              >{{ h.toString().padStart(2, '0') }}</button>
            }
          </div>

          <div class="w-px bg-black/10 dark:bg-white/10 my-1"></div>

          <!-- Minutes -->
          <div #minuteCol (scroll)="onColScroll(minuteCol)" class="relative flex-1 flex flex-col gap-0.5 max-h-60 overflow-y-auto">
            @for (m of loopMinutes(); track $index) {
              <button
                type="button"
                (click)="selectMinute(m)"
                [attr.data-active]="activeMinute() === m ? '' : null"
                class="w-full py-1.5 rounded-lg text-[15px] tabular-nums text-center transition-[transform,background-color] active:scale-[0.96] [-webkit-tap-highlight-color:transparent]"
                [class]="minuteClass(m)"
              >{{ m.toString().padStart(2, '0') }}</button>
            }
          </div>
        </div>
      </div>
    </ng-template>
  }
</div>
