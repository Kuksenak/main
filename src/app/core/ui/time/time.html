<div class="inline-flex w-auto flex-col gap-1.5">
  @if (label) {
    <span class="text-sm opacity-70">{{ label }}</span>
  }

  @if (isMobile()) {
    <!-- Mobile: native time picker -->
    <input
      type="time"
      [value]="value() ?? ''"
      [disabled]="disabled"
      (change)="onNativeChange($event)"
      class="chip"
    >
  } @else {
    <!-- Desktop: custom iOS-style time picker via CDK overlay -->
    <button
      #trigger
      type="button"
      cdkOverlayOrigin
      #origin="cdkOverlayOrigin"
      [disabled]="disabled"
      (click)="toggle(trigger)"
      (keydown)="onKeydown($event)"
      class="chip"
    >
      <span [class.opacity-40]="!value()">{{ triggerLabel() }}</span>
    </button>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="origin"
      [cdkConnectedOverlayOpen]="isOpen()"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (attach)="onOpened()"
      (backdropClick)="close()"
      (detach)="close()"
    >
      <div class="popover-panel mt-1.5 w-[180px] p-2">

        <div class="flex gap-1">
          <!-- Hours -->
          <div #hourCol (scroll)="onColScroll(hourCol)" class="relative flex-1 flex flex-col gap-0.5 max-h-60 overflow-y-auto">
            @for (h of loopHours(); track $index) {
              <button
                type="button"
                (click)="selectHour(h)"
                [attr.data-active]="activeHour() === h ? '' : null"
                class="w-full py-1.5 rounded-lg text-[15px] tabular-nums text-center transition-[transform,background-color] active:scale-[0.96] [-webkit-tap-highlight-color:transparent]"
                [class]="hourClass(h)"
              >{{ h.toString().padStart(2, '0') }}</button>
            }
          </div>

          <div class="w-px bg-[var(--separator)] my-1"></div>

          <!-- Minutes -->
          <div #minuteCol (scroll)="onColScroll(minuteCol)" class="relative flex-1 flex flex-col gap-0.5 max-h-60 overflow-y-auto">
            @for (m of loopMinutes(); track $index) {
              <button
                type="button"
                (click)="selectMinute(m)"
                [attr.data-active]="activeMinute() === m ? '' : null"
                class="w-full py-1.5 rounded-lg text-[15px] tabular-nums text-center transition-[transform,background-color] active:scale-[0.96] [-webkit-tap-highlight-color:transparent]"
                [class]="minuteClass(m)"
              >{{ m.toString().padStart(2, '0') }}</button>
            }
          </div>
        </div>
      </div>
    </ng-template>
  }
</div>
