<div class="inline-flex w-auto flex-col gap-1.5">

  @if (isMobile()) {
    <!-- Mobile: native time picker -->
    <input
      type="time"
      [value]="value() ?? ''"
      [disabled]="disabled"
      (change)="onNativeChange($event)"
      class="chip"
    >
  } @else {
    <!-- Desktop: custom iOS-style time picker via CDK overlay -->
    <button
     
      type="button"
      cdkOverlayOrigin
      #origin="cdkOverlayOrigin"
      [disabled]="disabled"
      (click)="toggle()"
      (keydown)="onKeydown($event)"
      class="chip"
    >
      <span [class.opacity-40]="!value()">{{ triggerLabel() }}</span>
    </button>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayPush]="true"
      [cdkConnectedOverlayViewportMargin]="8"
      [cdkConnectedOverlayOrigin]="origin"
      [cdkConnectedOverlayOpen]="isOpen()"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (attach)="onOpened()"
      (backdropClick)="close()"
      (detach)="close()"
    >
      <!-- Two narrow columns, edges fading out (they loop), no scrollbars -->
      <div class="popover-panel mt-1.5 w-40 px-3 py-2">

        <div class="flex gap-2">
          <!-- Hours -->
          <div #hourCol (scroll)="onColScroll(hourCol)" class="no-scrollbar relative flex max-h-56 flex-1 flex-col gap-px overflow-y-auto py-2 [mask-image:linear-gradient(transparent,black_18%,black_82%,transparent)]">
            @for (h of loopHours(); track $index) {
              <button
                type="button"
                (click)="selectHour(h)"
                [attr.data-active]="activeHour() === h ? '' : null"
                class="w-full rounded-md py-1 text-center text-[0.9375rem] tabular-nums transition-[transform,background-color] active:scale-[0.96] [-webkit-tap-highlight-color:transparent]"
                [class]="hourClass(h)"
              >{{ h.toString().padStart(2, '0') }}</button>
            }
          </div>

          <div class="my-3 w-px bg-[var(--separator)]"></div>

          <!-- Minutes -->
          <div #minuteCol (scroll)="onColScroll(minuteCol)" class="no-scrollbar relative flex max-h-56 flex-1 flex-col gap-px overflow-y-auto py-2 [mask-image:linear-gradient(transparent,black_18%,black_82%,transparent)]">
            @for (m of loopMinutes(); track $index) {
              <button
                type="button"
                (click)="selectMinute(m)"
                [attr.data-active]="activeMinute() === m ? '' : null"
                class="w-full rounded-md py-1 text-center text-[0.9375rem] tabular-nums transition-[transform,background-color] active:scale-[0.96] [-webkit-tap-highlight-color:transparent]"
                [class]="minuteClass(m)"
              >{{ m.toString().padStart(2, '0') }}</button>
            }
          </div>
        </div>
      </div>
    </ng-template>
  }
</div>
