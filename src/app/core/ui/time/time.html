<div class="inline-flex w-auto flex-col gap-1.5">

  @if (isMobile()) {
    <!-- Mobile: native time picker -->
    <input
      type="time"
      [value]="value() ?? ''"
      [disabled]="disabled"
      (change)="onNativeChange($event)"
      class="chip"
    >
  } @else {
    <!-- Desktop: custom iOS-style time picker via CDK overlay -->
    <button
     
      type="button"
      cdkOverlayOrigin
      #origin="cdkOverlayOrigin"
      [disabled]="disabled"
      (click)="toggle()"
      (keydown)="onKeydown($event)"
      class="chip"
    >
      <span [class.opacity-40]="!value()">{{ triggerLabel() }}</span>
    </button>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayPositions]="positions"
      [cdkConnectedOverlayOrigin]="origin"
      [cdkConnectedOverlayOpen]="isOpen()"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (attach)="onOpened()"
      (backdropClick)="close()"
      (detach)="close()"
    >
      <!-- iOS wheels: a fixed blue band across the middle; the hours / minutes scroll under it
           (snapping row by row) and whatever stops in the band is the time. Columns loop, their
           edges fade out, no scrollbars. 12px around, like the calendar. -->
      <div class="popover-panel relative w-max p-3">
        <div class="pointer-events-none absolute inset-x-3 top-1/2 h-8 -translate-y-1/2 rounded-md bg-[var(--accent)]"></div>
        <div class="relative flex gap-2">
          <!-- Hours -->
          <div #hourCol (scroll)="onColScroll(hourCol, 'h')" class="no-scrollbar flex h-56 w-16 snap-y snap-mandatory flex-col overflow-y-auto py-24 [mask-image:linear-gradient(transparent,black_30%,black_70%,transparent)]">
            @for (h of loopHours(); track $index) {
              <button
                type="button"
                (click)="scrollTo(hourCol, $index)"
                [attr.data-active]="activeHour() === h ? '' : null"
                class="h-8 w-full shrink-0 snap-center text-center text-[0.9375rem] tabular-nums transition-colors duration-100 [-webkit-tap-highlight-color:transparent] active:![transform:none]"
                [class.text-[var(--accent-fg)]]="centerH() === $index"
                [class.font-medium]="centerH() === $index"
              >{{ h.toString().padStart(2, '0') }}</button>
            }
          </div>

          <!-- Minutes -->
          <div #minuteCol (scroll)="onColScroll(minuteCol, 'm')" class="no-scrollbar flex h-56 w-16 snap-y snap-mandatory flex-col overflow-y-auto py-24 [mask-image:linear-gradient(transparent,black_30%,black_70%,transparent)]">
            @for (m of loopMinutes(); track $index) {
              <button
                type="button"
                (click)="scrollTo(minuteCol, $index)"
                [attr.data-active]="activeMinute() === m ? '' : null"
                class="h-8 w-full shrink-0 snap-center text-center text-[0.9375rem] tabular-nums transition-colors duration-100 [-webkit-tap-highlight-color:transparent] active:![transform:none]"
                [class.text-[var(--accent-fg)]]="centerM() === $index"
                [class.font-medium]="centerM() === $index"
              >{{ m.toString().padStart(2, '0') }}</button>
            }
          </div>
        </div>
      </div>
    </ng-template>
  }
</div>
