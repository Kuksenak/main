<div class="inline-flex w-auto flex-col gap-1.5">

  @if (isMobile()) {
    <!-- Mobile: native select with an iOS-style up/down chevron -->
    <div class="inline-flex items-center" [class.relative]="!stretch">
    <!-- stretch: the (invisible) native select covers the whole row; a chip shows the value -->
    @if (stretch) {
      <span class="chip pointer-events-none !bg-transparent pr-8">{{ triggerLabel() }}</span>
    }
    <select
      [value]="value() ?? ''"
      [disabled]="disabled"
      (change)="onNativeChange($event)"
      class="chip pr-8"
      [class.absolute]="stretch"
      [class.inset-0]="stretch"
      [class.!h-full]="stretch"
      [class.!w-full]="stretch"
      [class.opacity-0]="stretch"
    >
      @if (value() === null) {
        <option value="" disabled selected>{{ triggerLabel() }}</option>
      }
      @for (sec of sections(); track $index) {
        @if (sec.label) {
          <optgroup [label]="sec.label">
            @for (opt of sec.options; track opt.value) {
              <option [value]="opt.value">{{ opt.label }}</option>
            }
          </optgroup>
        } @else {
          @for (opt of sec.options; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        }
      }
    </select>
    <app-icon name="chevrons-up-down" class="pointer-events-none absolute right-2 size-5" [class.!right-6]="stretch" />
    </div>
  } @else {
    <!-- Desktop: custom iOS-style dropdown via CDK overlay -->
    <button
     
      type="button"
      cdkOverlayOrigin
      #origin="cdkOverlayOrigin"
      [disabled]="disabled"
      (click)="toggle()"
      class="chip gap-2"
      [class.!bg-transparent]="stretch"
      [class.!pr-0]="stretch"
    >
      <span [class.opacity-40]="value() === null">{{ triggerLabel() }}</span>
      <app-icon name="chevrons-up-down" class="size-5" />
    </button>

    @if (stretch) {
      <button type="button" tabindex="-1" aria-hidden="true" (click)="toggle()" [disabled]="disabled" class="absolute inset-0 cursor-pointer active:!scale-100"></button>
    }

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayPositions]="positions"
      [cdkConnectedOverlayOrigin]="origin"
      [cdkConnectedOverlayOpen]="isOpen()"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="close()"
      (detach)="close()"
    >
      <!-- overflow-visible: the scroll indicator sits just outside the panel -->
      <div class="popover-panel min-w-40 !overflow-visible p-1">
        <app-scroll-area class="max-h-72" contentClass="gap-0.5">
        @for (sec of sections(); track $index) {
          @if (sec.label) {
            <div class="text-footnote px-3 pb-1 pt-2 opacity-50">{{ sec.label }}</div>
          }
          @for (opt of sec.options; track opt.value) {
          <button
            type="button"
            (click)="select(opt)"
            class="w-full flex items-center justify-between gap-3 px-3 py-2.5 rounded-lg text-subhead text-left transition-[transform,background-color] active:scale-[0.98] [-webkit-tap-highlight-color:transparent]"
            [class]="isSelected(opt)
              ? 'option-selected'
              : 'option'"
          >
            <span>{{ opt.label }}</span>
            @if (isSelected(opt)) {
              <app-icon name="check" [strokeWidth]="2.5" class="size-4" />
            }
          </button>
        }
        }
        </app-scroll-area>
      </div>
    </ng-template>
  }
</div>
