<div class="inline-flex w-auto flex-col gap-1.5">
  @if (label) {
    <span class="text-sm opacity-70">{{ label }}</span>
  }

  @if (isMobile()) {
    <!-- Mobile: native select with an iOS-style up/down chevron -->
    <div class="relative inline-flex items-center">
    <select
      [value]="value() ?? ''"
      [disabled]="disabled"
      (change)="onNativeChange($event)"
      class="chip pr-8"
    >
      @for (opt of options; track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
    <app-icon name="chevrons-up-down" class="pointer-events-none absolute right-2 size-5" />
    </div>
  } @else {
    <!-- Desktop: custom iOS-style dropdown via CDK overlay -->
    <button
      #trigger
      type="button"
      cdkOverlayOrigin
      #origin="cdkOverlayOrigin"
      [disabled]="disabled"
      (click)="toggle()"
      class="chip gap-2"
    >
      <span [class.opacity-40]="value() === null">{{ triggerLabel() }}</span>
      <app-icon name="chevrons-up-down" class="size-5" />
    </button>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="origin"
      [cdkConnectedOverlayOpen]="isOpen()"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="close()"
      (detach)="close()"
    >
      <div class="popover-panel mt-1.5 min-w-[160px] p-1">
        @for (opt of options; track opt.value) {
          <button
            type="button"
            (click)="select(opt)"
            class="w-full flex items-center justify-between gap-3 px-3 py-2 rounded-lg text-[15px] text-left transition-[transform,background-color] active:scale-[0.98] [-webkit-tap-highlight-color:transparent]"
            [class]="isSelected(opt)
              ? 'option-selected'
              : 'option'"
          >
            <span>{{ opt.label }}</span>
            @if (isSelected(opt)) {
              <app-icon name="check" [strokeWidth]="2.5" class="size-4" />
            }
          </button>
        }
      </div>
    </ng-template>
  }
</div>
