<div class="inline-flex w-auto flex-col gap-1.5">
  @if (label) {
    <span class="text-sm opacity-70">{{ label }}</span>
  }

  @if (isMobile()) {
    <!-- Mobile: native select with an iOS-style up/down chevron -->
    <div class="relative inline-flex items-center">
    <select
      [value]="value() ?? ''"
      [disabled]="disabled"
      (change)="onNativeChange($event)"
      class="appearance-none border-0 py-1 pl-2.5 pr-8 rounded-lg text-current bg-black/[0.04] dark:bg-white/[0.06] text-[17px] [font-family:-apple-system,BlinkMacSystemFont,'SF_Pro_Text',system-ui,sans-serif] focus:outline-none [-webkit-tap-highlight-color:transparent] disabled:opacity-40"
    >
      @for (opt of options; track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
    <span class="pointer-events-none absolute right-2 flex items-center">
      <svg viewBox="0 0 24 24" fill="none" class="pointer-events-none size-5 shrink-0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8.5 9.5 12 6l3.5 3.5" />
        <path d="M8.5 14.5 12 18l3.5-3.5" />
      </svg>
    </span>
    </div>
  } @else {
    <!-- Desktop: custom iOS-style dropdown via CDK overlay -->
    <button
      #trigger
      type="button"
      cdkOverlayOrigin
      #origin="cdkOverlayOrigin"
      [disabled]="disabled"
      (click)="toggle()"
      class="inline-flex w-auto items-center gap-2 px-2.5 py-1 rounded-lg bg-black/[0.04] dark:bg-white/[0.06] text-[15px] text-left whitespace-nowrap focus:outline-none [-webkit-tap-highlight-color:transparent] disabled:opacity-40 hover:bg-black/5 dark:hover:bg-white/10 transition-colors"
    >
      <span [class.opacity-40]="value() === null">{{ triggerLabel() }}</span>
      <svg viewBox="0 0 24 24" fill="none" class="pointer-events-none size-5 shrink-0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8.5 9.5 12 6l3.5 3.5" />
        <path d="M8.5 14.5 12 18l3.5-3.5" />
      </svg>
    </button>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="origin"
      [cdkConnectedOverlayOpen]="isOpen()"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="close()"
      (detach)="close()"
    >
      <div class="mt-1.5 p-1 min-w-[160px] rounded-2xl bg-[var(--surface)] overflow-hidden
                  origin-top [animation:dropdownIn_160ms_cubic-bezier(0.2,0,0,1)]
                  shadow-[0_0_0_1px_rgba(0,0,0,0.08),0_8px_30px_rgba(0,0,0,0.12)]
                  dark:shadow-[0_0_0_1px_rgba(255,255,255,0.06),0_8px_30px_rgba(0,0,0,0.5)]">
        @for (opt of options; track opt.value) {
          <button
            type="button"
            (click)="select(opt)"
            class="w-full flex items-center justify-between gap-3 px-3 py-2 rounded-lg text-[15px] text-left transition-[transform,background-color] active:scale-[0.98] [-webkit-tap-highlight-color:transparent]"
            [class]="isSelected(opt)
              ? 'bg-[var(--accent)] text-white font-semibold'
              : 'hover:bg-black/5 dark:hover:bg-white/10'"
          >
            <span>{{ opt.label }}</span>
            @if (isSelected(opt)) {
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
            }
          </button>
        }
      </div>
    </ng-template>
  }
</div>
