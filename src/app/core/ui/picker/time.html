@if (desktop) {
  <button type="button" (click)="open.set(!open())" [attr.aria-expanded]="open()" class="inline-flex h-button items-center rounded-full bg-tint px-3.5 text-ui text-fg tabular-nums hover:bg-tint-strong">
    {{ value() ?? '—' }}
  </button>
  @if (open()) {
    <div class="fixed inset-0 z-40" (click)="open.set(false)"></div>
    <!-- Two narrow columns under the chip, their ends fading out -->
    <div class="absolute top-full left-0 z-50 mt-1.5 flex animate-menu-in gap-1 rounded-menu bg-dialog p-1.5 text-fg shadow-popover">
      <div #column class="flex max-h-52 flex-col gap-px overflow-y-auto [scrollbar-width:none] [mask-image:linear-gradient(transparent,black_18%,black_82%,transparent)]">
        @for (h of hours; track h) {
          <button type="button" (click)="set(h, minute())" [attr.data-on]="h === hour() ? '' : null" class="w-12 shrink-0 rounded-md py-1 text-center text-ui tabular-nums hover:bg-tint-strong data-on:bg-tint-strong data-on:font-semibold">
            {{ pad(h) }}
          </button>
        }
      </div>
      <span class="my-2 w-px bg-separator"></span>
      <div #column class="flex max-h-52 flex-col gap-px overflow-y-auto [scrollbar-width:none] [mask-image:linear-gradient(transparent,black_18%,black_82%,transparent)]">
        @for (m of minutes; track m) {
          <button type="button" (click)="set(hour(), m); open.set(false)" [attr.data-on]="m === minute() ? '' : null" class="w-12 shrink-0 rounded-md py-1 text-center text-ui tabular-nums hover:bg-tint-strong data-on:bg-tint-strong data-on:font-semibold">
            {{ pad(m) }}
          </button>
        }
      </div>
    </div>
  }
} @else {
  <!-- Phones: the chip, the system's own time picker over it, unseen (a tap opens it) -->
  <span class="pointer-events-none inline-flex h-button items-center rounded-full bg-tint px-3.5 text-body text-fg tabular-nums">{{ value() ?? '—' }}</span>
  <input #field type="time" class="absolute inset-0 opacity-0" [value]="value() ?? ''" (change)="typed(field.value)" />
}
