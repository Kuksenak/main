<div class="grid grid-cols-7 pb-1 mobile:border-b-[0.5px] mobile:border-separator">
  @for (weekday of weekdays(); track $index) {
    <span class="text-center text-cal-weekday font-medium uppercase text-fg-secondary">{{ weekday }}</span>
  }
</div>

<!-- Six weeks tall; snaps to a week; no scrollbar (as iOS Calendar's) -->
<div
  #scroller
  (scroll)="scrolled()"
  class="h-[calc(var(--cal-row-h)*6)] snap-y snap-proximity overflow-y-auto overscroll-contain [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
>
  @for (week of weeks; track week[0].getTime()) {
    <div class="grid h-cal-row snap-start grid-cols-7 mobile:border-b-[0.5px] mobile:border-separator">
      @for (day of week; track day.getTime()) {
        <!-- (data-mark: picked — phones as iOS's: a pale accent circle, its number in the accent;
             desktops: dark; today — the accent; picked today — phones: a full accent circle) -->
        <button
          type="button"
          (click)="selected.set(day)"
          class="group flex justify-center pt-1"
          [class.opacity-35]="!inMonth(day)"
          [attr.aria-pressed]="isSelected(day)"
          [attr.data-mark]="isSelected(day) ? (isToday(day) ? 'picked-today' : 'picked') : isToday(day) ? 'today' : null"
        >
          <span
            class="flex size-cal-day items-center justify-center rounded-full text-cal-day tabular-nums mobile:font-semibold
                   group-[:hover:not([aria-pressed=true])]:bg-tint
                   group-data-[mark=today]:font-semibold group-data-[mark=today]:text-accent
                   group-data-[mark=picked]:font-semibold mobile:group-data-[mark=picked]:bg-accent/15 mobile:group-data-[mark=picked]:text-accent
                   desktop:group-data-[mark=picked]:bg-fg desktop:group-data-[mark=picked]:text-app
                   group-data-[mark=picked-today]:font-semibold mobile:group-data-[mark=picked-today]:bg-accent mobile:group-data-[mark=picked-today]:text-on-accent
                   desktop:group-data-[mark=picked-today]:bg-fg desktop:group-data-[mark=picked-today]:text-app"
          >{{ day.getDate() }}</span>
        </button>
      }
    </div>
  }
</div>
