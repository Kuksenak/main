<div class="flex flex-col px-4 pt-2 desktop:px-10 desktop:pt-8">
  <section class="flex w-full flex-col gap-1 desktop:w-68">
    <div class="flex h-button items-center mobile:hidden">
      <h1 class="ml-1 flex-1 text-body font-medium">{{ title() }}</h1>
      <button uiButton type="button" (click)="today()">{{ 'schedule.today' | t }}</button>
    </div>
    <app-calendar class="mobile:-mx-4" [(selected)]="selected" [(month)]="month" />
  </section>
</div>

<!-- Phones: Today floating at the bottom left, just above the home indicator -->
<button
  type="button"
  uiFloatingButton
  (click)="today()"
  class="fixed bottom-[max(0.75rem,calc(env(safe-area-inset-bottom)-0.25rem))] left-4 z-20 desktop:hidden"
>
  {{ 'schedule.today' | t }}
</button>
