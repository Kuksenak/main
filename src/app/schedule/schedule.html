<!-- Desktops: the calendar at the left (the month, Today, New event over it), the picked day's events at
     its right. Phones: the calendar edge to edge, the day's events under it; Today floating at the
     bottom left, + at the bottom right. -->
<div class="flex flex-col gap-4 px-4 pt-2 pb-24 desktop:flex-row desktop:gap-10 desktop:px-10 desktop:pt-8 desktop:pb-10">
  <section class="flex w-full shrink-0 flex-col gap-1 desktop:w-68">
    <div class="flex h-button items-center gap-0.5 mobile:hidden">
      <h1 class="ml-1 flex-1 text-body font-medium">{{ title() }}</h1>
      <button uiButton type="button" (click)="today()">{{ 'schedule.today' | t }}</button>
      <button uiButton type="button" icon="plus" (click)="create()" [uiTip]="'schedule.newEvent' | t" [attr.aria-label]="'schedule.newEvent' | t"></button>
    </div>
    <app-calendar [(selected)]="selected" [(month)]="month" [marked]="store.marked()" />
  </section>

  <!-- The picked day's events: a row each — when (its start and end), its title, ⟲ if it repeats, its
       pages' count; past ones gray; a click opens it -->
  <section class="flex min-w-0 flex-1 flex-col gap-2">
    <h2 class="px-1 text-body font-medium mobile:font-semibold mobile:text-fg-secondary">{{ dayTitle() }}</h2>
    @if (desktop) {
      <div class="flex flex-col gap-0.5">
        @for (event of events(); track event.id + event.startsAt) {
          <button
            type="button"
            (click)="open(event)"
            [class.opacity-50]="past(event)"
            class="flex h-10 w-full items-center gap-3 rounded-lg px-2 text-left hover:bg-tint"
          >
            <span class="w-24 shrink-0 text-ui text-fg-secondary tabular-nums">{{ span(event) }}</span>
            <span class="min-w-0 flex-1 truncate text-ui text-fg">{{ event.title }}</span>
            @if (event.repeat !== 'Never') {
              <app-icon name="update" class="size-4 shrink-0 text-icon" />
            }
            @if (event.pageIds.length) {
              <span class="flex shrink-0 items-center gap-1 text-footnote text-fg-secondary"><app-icon name="page" class="size-4 text-icon" />{{ event.pageIds.length }}</span>
            }
          </button>
        } @empty {
          <p class="px-1 py-6 text-ui text-fg-secondary">{{ 'schedule.noEvents' | t }}</p>
        }
      </div>
    } @else {
      <ui-list>
        @for (event of events(); track event.id + event.startsAt) {
          <button type="button" uiListItem chevron (click)="open(event)" [class.opacity-50]="past(event)">
            <span class="flex min-w-0 items-center gap-3">
              <span class="w-12 shrink-0 text-fg-secondary tabular-nums">{{ start(event) }}</span>
              <span class="truncate">{{ event.title }}</span>
            </span>
            @if (event.repeat !== 'Never') {
              <app-icon itemValue name="update" class="size-4 text-icon" />
            }
          </button>
        } @empty {
          <div uiListItem><span class="text-fg-secondary">{{ 'schedule.noEvents' | t }}</span></div>
        }
      </ui-list>
    }
  </section>
</div>

<!-- Phones: Today floating at the bottom left, + (a new event on the picked day) at the bottom right -->
<button
  type="button"
  uiFloatingButton
  (click)="today()"
  class="fixed bottom-[max(0.75rem,calc(env(safe-area-inset-bottom)-0.25rem))] left-4 z-20 desktop:hidden"
>
  {{ 'schedule.today' | t }}
</button>
<button
  type="button"
  uiFloatingButton
  round
  accent
  (click)="create()"
  [attr.aria-label]="'schedule.newEvent' | t"
  class="fixed right-4 bottom-[max(0.75rem,calc(env(safe-area-inset-bottom)-0.25rem))] z-20 desktop:hidden"
>
  <app-icon name="plus" class="size-8" />
</button>

<!-- An event: new, or as it is -->
@if (editing(); as e) {
  <app-event-editor [event]="e.event" [day]="selected()" (closed)="editing.set(null)" />
}
