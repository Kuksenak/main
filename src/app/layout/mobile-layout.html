<!-- (with the keyboard up: down to it only — what's under the keyboard isn't the page's) -->
<div
  class="relative h-full bg-app text-fg"
  [style.height.px]="area.keyboard() ? area.top() + area.height() : null"
>
  <!-- The top bar over the page, the page passing under it (seen through it, paler: the page's own
       fade, see main). Fixed to the top of the part of the screen that's
       seen: iOS shifting the view up for the keyboard doesn't take it along. -->
  <header
    [style.top.px]="area.top()"
    class="pointer-events-none fixed inset-x-0 z-30 flex items-center gap-2 px-4 pt-[calc(env(safe-area-inset-top)+0.5rem)] pb-5 *:pointer-events-auto"
  >
    <!-- A page opened from a list: ‹ back to it, the title smaller in the middle (as a sheet's page:
         Users, Language), its own ⋯ at the right (none: room as wide, the title kept in the middle) -->
    @if (back(); as to) {
      <a
        uiFloatingButton
        round
        [routerLink]="to"
        data-vt="page-back"
        [attr.aria-label]="'action.back' | t"
      >
        <app-icon name="chevron-left" class="-ml-0.5 size-8" />
      </a>
      <span class="min-w-0 flex-1 truncate text-center text-body font-semibold" data-vt="page-title">{{
        title()
      }}</span>
      <!-- (the page's own ⋯, at the right) -->
      @if (menu(); as open) {
        <button type="button" uiFloatingButton round (click)="open()" [attr.aria-label]="'library.more' | t">
          <app-icon name="dots" class="size-7" />
        </button>
      } @else {
        <span class="w-round shrink-0"></span>
      }
    } @else {
      <!-- A section: a pill with its icon and name, ▾ — the shared select (phones: the system's own
           menu of the sections): one picked, it opens -->
      <div class="min-w-0 flex-1">
        <ui-select [options]="places()" [value]="here()" [text]="title()" [wide]="true" [glass]="true" (valueChange)="go($event)" [label]="'nav.menu' | t" />
      </div>
    }
    <!-- (not inside a page opened from a list: there, only ‹ and its title) -->
    @if (!back()) {
      <button
        type="button"
        uiFloatingButton
        round
        (click)="searchBar().start()"
        [attr.aria-label]="'search.title' | t"
      >
        <app-icon name="search" class="size-7" />
      </button>
      <button
        type="button"
        uiFloatingButton
        round
        accent
        (click)="accountOpen.set(true)"
        class="relative"
        [attr.aria-label]="'account.title' | t"
      >
        <span class="text-[1.25rem] font-medium uppercase">{{ initial() }}</span>
        <!-- (a new version ready: a green dot on it) -->
        @if (updates.ready()) {
          <span
            class="absolute top-0 right-0 size-3 rounded-full bg-success ring-2 ring-app"
          ></span>
        }
      </button>
    }
  </header>
  <!-- (from the screen's top: what's scrolled goes on under the top bar, seen through it paler — not
       cut off at a line under its buttons, as a sheet's under its head; at the bottom fading out under
       the floating buttons and the home indicator; its scroll bar only on what's seen; clipping the
       next page as it slides in) -->
  <main
    #main
    uiScrollBar
    [barTop]="barTop()"
    [barBottom]="30"
    class="absolute inset-x-0 top-0 bottom-0 min-w-0 overflow-x-hidden overflow-y-auto overscroll-contain pt-[calc(env(safe-area-inset-top)+3.75rem)]
           [mask-image:linear-gradient(to_bottom,transparent_env(safe-area-inset-top),rgb(0_0_0/0.08)_calc(env(safe-area-inset-top)+1.5rem),rgb(0_0_0/0.35)_calc(env(safe-area-inset-top)+2.75rem),black_calc(env(safe-area-inset-top)+3.75rem),black_calc(100%-env(safe-area-inset-bottom)-1.5rem),transparent_100%)]"
    data-vt="page"
  >
    <router-outlet (activate)="entered()" />
  </main>
</div>

@if (accountOpen()) {
  <app-account-sheet (closed)="accountOpen.set(false)" />
}
<!-- The search (there, unseen, all the while: 🔍 focuses its field during the tap, else iOS
     doesn't open the keyboard) -->
<app-search-bar />
