<!-- (with the keyboard up: down to it only — what's under the keyboard isn't the page's) -->
<div
  class="relative h-full bg-app text-fg"
  [style.height.px]="area.keyboard() ? area.top() + area.height() : null"
>
  <!-- The top bar over the page, the page passing under it: it fades from the page's color to
       nothing, the page's text drifting into it. Fixed to the top of the part of the screen that's
       seen: iOS shifting the view up for the keyboard doesn't take it along. -->
  <header
    [style.top.px]="area.top()"
    class="pointer-events-none fixed inset-x-0 z-30 flex items-center gap-3 bg-linear-to-b from-app from-60% to-transparent px-4 pt-[calc(env(safe-area-inset-top)+0.5rem)] pb-5 *:pointer-events-auto"
  >
    <!-- A page opened from a list: ‹ back to it, the title smaller next to it -->
    @if (back(); as to) {
      <a
        uiFloatingButton
        round
        [routerLink]="to"
        data-vt="page-back"
        [attr.aria-label]="'action.back' | t"
      >
        <app-icon name="chevron-left" class="-ml-0.5 size-8" />
      </a>
      <span class="min-w-0 flex-1 truncate text-body font-semibold" data-vt="page-title">{{
        title()
      }}</span>
    } @else {
      <span class="min-w-0 flex-1 truncate text-xl font-semibold" data-vt="page-title">{{
        title()
      }}</span>
    }
    <!-- (not inside a page opened from a list: there, only ‹ and its title) -->
    @if (!back()) {
      <button
        type="button"
        uiFloatingButton
        round
        (click)="searchBar().start()"
        [attr.aria-label]="'search.title' | t"
      >
        <app-icon name="search" class="size-7" />
      </button>
      <button
        type="button"
        uiFloatingButton
        round
        (click)="placesOpen.set(true)"
        [attr.aria-label]="'nav.menu' | t"
      >
        <app-icon name="grid" class="size-7" />
      </button>
      <button
        type="button"
        uiFloatingButton
        round
        accent
        (click)="accountOpen.set(true)"
        class="relative"
        [attr.aria-label]="'account.title' | t"
      >
        <span class="text-[1.25rem] font-medium uppercase">{{ initial() }}</span>
        <!-- (a new version ready: a green dot on it) -->
        @if (updates.ready()) {
          <span
            class="absolute top-0 right-0 size-3 rounded-full bg-success ring-2 ring-app"
          ></span>
        }
      </button>
    }
  </header>
  <!-- (its top under the bar; clipping the next page as it slides in) -->
  <main
    class="h-full min-w-0 overflow-x-hidden overflow-y-auto overscroll-contain pt-[calc(env(safe-area-inset-top)+3.75rem)]"
    data-vt="page"
  >
    <router-outlet (activate)="entered()" />
  </main>
</div>

@if (placesOpen()) {
  <app-places-sheet (closed)="placesOpen.set(false)" />
}
@if (accountOpen()) {
  <app-account-sheet (closed)="accountOpen.set(false)" />
}
<!-- The search (there, unseen, all the while: 🔍 focuses its field during the tap, else iOS
     doesn't open the keyboard) -->
<app-search-bar />
