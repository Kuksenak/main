<!-- (with the keyboard up: down to it only — what's under the keyboard isn't the page's) -->
<div
  class="relative h-full bg-app text-fg"
  [style.height.px]="area.keyboard() ? area.top() + area.height() : null"
  [attr.data-filtering]="filtering() ? '' : null"
>
  <!-- The top bar over the page, the page passing under it: it fades from the page's color to
       nothing, the page's text drifting into it -->
  <header
    class="pointer-events-none absolute inset-x-0 top-0 z-30 flex items-center gap-3 bg-linear-to-b from-app from-60% to-transparent px-4 pt-[calc(env(safe-area-inset-top)+0.5rem)] pb-5
           *:pointer-events-auto"
  >
    <!-- A page opened from a list: ‹ back to it, the title smaller next to it -->
    @if (back(); as to) {
      <a uiFloatingButton round [routerLink]="to" [attr.aria-label]="'action.back' | t">
        <app-icon name="chevron-left" class="-ml-0.5 size-7" />
      </a>
      <span class="min-w-0 flex-1 truncate text-body font-semibold">{{ title() }}</span>
    } @else {
      <span class="min-w-0 flex-1 truncate text-xl font-semibold">{{ title() }}</span>
    }
    <!-- The open page's filter (only on a page that has one): the capsule at the bottom -->
    @if (filter.offered()) {
      <button type="button" uiFloatingButton round (click)="filterBar()?.start()" [attr.aria-label]="'filter.title' | t">
        <app-icon name="filter" class="size-6" />
      </button>
    }
    <button type="button" uiFloatingButton round (click)="searchBar().start()" [attr.aria-label]="'search.title' | t">
      <app-icon name="search" class="size-6" />
    </button>
    <button type="button" uiFloatingButton round (click)="placesOpen.set(true)" [attr.aria-label]="'nav.menu' | t">
      <app-icon name="grid" class="size-6" />
    </button>
    <button type="button" uiFloatingButton round accent (click)="accountOpen.set(true)" class="relative" [attr.aria-label]="'account.title' | t">
      <span class="text-[1.25rem] font-medium uppercase">{{ initial() }}</span>
      <!-- (a new version ready: a green dot on it) -->
      @if (updates.ready()) {
        <span class="absolute top-0 right-0 size-3 rounded-full bg-success ring-2 ring-app"></span>
      }
    </button>
  </header>
  <!-- (its top under the bar; filtering, room at the bottom for the capsule) -->
  <main
    class="h-full min-w-0 overflow-y-auto overscroll-contain pt-[calc(env(safe-area-inset-top)+3.75rem)] in-data-filtering:pb-20"
  >
    <router-outlet />
  </main>
</div>

@if (placesOpen()) {
  <app-places-sheet (closed)="placesOpen.set(false)" />
}
@if (accountOpen()) {
  <app-account-sheet (closed)="accountOpen.set(false)" />
}
<!-- The filter (there, unseen, while the page has one) and the search (there, unseen, all the
     while): their buttons focus their fields during the tap, else iOS doesn't open the keyboard -->
@if (filter.offered()) {
  <app-filter-bar />
}
<app-search-bar />
