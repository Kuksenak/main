<div class="flex h-full bg-app text-fg">
  <ui-sidebar>
    <!-- Search (Ctrl+K / ⌘K too), over the sections, as Notion's (measured): a field-like box 32 tall,
         as wide as the rows (12 in from the sidebar's sides), a faint hairline, no fill (a gray one under the pointer), its words
         gray, the keys on a chip -->
    <button
      type="button"
      (click)="searchOpen.set(true)"
      class="mb-1.5 flex h-8 shrink-0 items-center gap-2 rounded-lg border-[0.8px] border-fg/7 pr-1.5 pl-2 text-left text-ui
             text-fg-secondary outline-none hover:bg-side-hover focus-visible:bg-side-hover active:transform-none"
    >
      <span class="min-w-0 flex-1 truncate">{{ 'search.title' | t }}</span>
      <span class="shrink-0 rounded-[0.3rem] bg-tint-strong px-1.5 py-px text-footnote">{{ shortcut }}</span>
    </button>
    @for (place of places(); track place.path) {
      <!-- (the start page: current only on itself) -->
      <a uiSidebarItem [icon]="place.icon" [routerLink]="place.path" [routerLinkActiveOptions]="{ exact: place.path === '/' }">{{ place.label | t }}</a>
    }
    <button
      #account
      sidebarFoot
      uiButton
      type="button"
      [caret]="true"
      (click)="menuAt.set(menuAt() ? null : account.element)"
      aria-haspopup="menu"
      [attr.aria-expanded]="!!menuAt()"
      [attr.aria-label]="'account.title' | t"
    >
      <!-- (a new version ready: a green dot on it) -->
      <ui-avatar [name]="userName()" [dot]="updates.ready()" />
      {{ userName() }}
    </button>
  </ui-sidebar>
  <main class="min-h-0 min-w-0 flex-1 overflow-y-auto">
    <router-outlet />
  </main>
</div>

@if (menuAt(); as at) {
  <ui-menu [origin]="at" (closed)="menuAt.set(null)">
    <ui-menu-label>{{ auth.email() }}</ui-menu-label>
    <ui-menu-separator />
    @if (auth.isAdmin()) {
      <button type="button" uiMenuItem icon="lock" (click)="router.navigateByUrl('/users')">{{ 'users.title' | t }}</button>
      <ui-menu-separator />
    }
    <ui-menu-label icon="globe">{{ 'account.language' | t }}</ui-menu-label>
    @for (language of i18n.languages; track language.code) {
      <button type="button" uiMenuItem [checked]="language.code === i18n.lang()" (click)="i18n.setLang(language.code)">{{ language.label }}</button>
    }
    <ui-menu-separator />
    @if (updates.ready()) {
      <button type="button" uiMenuItem icon="update" (click)="updates.apply()"><span class="text-accent">{{ 'account.update' | t }}</span></button>
    }
    <button type="button" uiMenuItem icon="logout" danger (click)="auth.logout()">{{ 'account.logout' | t }}</button>
    <button type="button" uiMenuItem icon="logout-all" danger (click)="auth.logoutEverywhere()">{{ 'account.logoutEverywhere' | t }}</button>
  </ui-menu>
}

<!-- The search window (as Notion's / Claude's) -->
@if (searchOpen()) {
  <app-search (closed)="searchOpen.set(false)" />
}
