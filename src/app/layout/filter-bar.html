<!-- On the part of the screen that's seen (with the keyboard up: what's over it), the page under it
     seen and its own (taps go through). Unseen (closed, or the keyboard still coming): at the top;
     shown: at the bottom, just over the keyboard — the capsule, ✕ at its right (taken only then) -->
<div
  class="pointer-events-none fixed inset-x-0 z-40 flex flex-col justify-start opacity-0 transition-opacity duration-200 data-shown:justify-end data-shown:opacity-100"
  [attr.data-shown]="shown() ? '' : null"
  [attr.aria-hidden]="open() ? null : 'true'"
  [style.top.px]="area.top()"
  [style.height.px]="area.height()"
>
  <!-- (under the capsule: the page's color, fading to nothing upwards — the page's text drifting in) -->
  <div class="absolute inset-x-0 bottom-0 h-28 bg-linear-to-t from-app from-35% to-transparent"></div>
  <!-- As iOS's bar over the keyboard just under it: as wide, as tall, the same glass and rim, the
       same room between (in the browser, Safari's own bar there sits higher: a little more) -->
  <div class="relative mx-4 flex items-center gap-2" [style.margin-bottom]="typing() || area.keyboard() ? (inBrowser ? '0.625rem' : '0') : 'max(0.75rem, env(safe-area-inset-bottom))'">
    <!-- The capsule: the funnel, the field -->
    <form
      class="flex h-bar min-w-0 flex-1 items-center gap-2.5 rounded-full border-[0.5px] border-bar-border bg-bar px-4 text-fg backdrop-blur-[30px] backdrop-saturate-[180%]
             in-data-shown:pointer-events-auto"
      (submit)="submit($event)"
    >
      <app-icon name="filter" class="size-5.5 shrink-0 text-icon" />
      <input
        #field
        type="search"
        enterkeyhint="search"
        autocomplete="off"
        [value]="filter.query()"
        (input)="filter.query.set(field.value)"
        (focus)="typing.set(true)"
        (blur)="typing.set(false)"
        [placeholder]="'filter.placeholder' | t"
        class="min-w-0 flex-1 bg-transparent text-body text-fg outline-none placeholder:text-fg-secondary [&::-webkit-search-cancel-button]:hidden"
      />
    </form>
    <!-- ✕: a circle of the same -->
    <button
      type="button"
      (click)="close()"
      [attr.aria-label]="'search.close' | t"
      class="grid size-bar shrink-0 place-items-center rounded-full border-[0.5px] border-bar-border bg-bar text-fg backdrop-blur-[30px] backdrop-saturate-[180%]
             transition-[scale] duration-200 active:scale-110 in-data-shown:pointer-events-auto"
    >
      <app-icon name="close" class="size-5.5" />
    </button>
  </div>
</div>
