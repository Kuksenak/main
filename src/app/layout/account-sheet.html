<ui-sheet #sheet [tall]="true" (closed)="closed.emit()">
  @if (page() === 'language') {
    <!-- The language's page: ‹ back, the page's name in the middle; it slides in -->
    <div class="relative mb-3 flex h-round shrink-0 animate-pane-in items-center justify-center">
      <button type="button" uiGlassButton round (click)="back()" [attr.aria-label]="'action.back' | t" class="absolute left-0">
        <app-icon name="chevron-left" class="-ml-0.5 size-7" />
      </button>
      <span class="text-body font-semibold">{{ 'account.language' | t }}</span>
    </div>
    <ui-card class="animate-pane-in">
      @for (language of i18n.languages; track language.code) {
        <button type="button" uiListRow [checked]="language.code === i18n.lang()" (click)="i18n.setLang(language.code); back()">
          {{ language.label }}
        </button>
      }
    </ui-card>
  } @else {
    <div class="flex flex-1 flex-col gap-6" [class.animate-pane-back]="cameBack">
      <ui-card>
        <div uiListRow icon="person">{{ auth.email() }}</div>
      </ui-card>

      @if (auth.isAdmin()) {
        <ui-card>
          <button type="button" uiListRow icon="shield" chevron (click)="go('/admin', sheet)">{{ 'admin.title' | t }}</button>
        </ui-card>
      }

      <!-- The language: a row (the current one in gray, ›) — its list slides in on a page of its own -->
      <ui-card>
        <button type="button" uiListRow icon="globe" chevron (click)="page.set('language')">
          {{ 'account.language' | t }}
          <span rowValue class="text-fg-secondary">{{ language() }}</span>
        </button>
      </ui-card>

      <div class="mt-auto flex flex-col gap-3">
        <!-- A new version downloaded: switch to it (the page reloads) -->
        @if (updates.ready()) {
          <ui-card>
            <button type="button" uiListRow icon="update" (click)="updates.apply()"><span class="text-accent">{{ 'account.update' | t }}</span></button>
          </ui-card>
        }
        <ui-card>
          <button type="button" uiListRow icon="logout" danger (click)="auth.logout()">{{ 'account.logout' | t }}</button>
          <button type="button" uiListRow icon="logout-all" danger (click)="auth.logoutEverywhere()">{{ 'account.logoutEverywhere' | t }}</button>
        </ui-card>
      </div>
    </div>
  }
</ui-sheet>
