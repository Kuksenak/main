<ui-sheet [tall]="true" (closed)="closed.emit()">
  @if (page(); as open) {
    <!-- A page in the sheet: ‹ back, its name in the middle; it slides in (back to it: from the left) -->
    <div
      class="relative mb-3 flex h-round shrink-0 items-center justify-center"
      [class.animate-pane-in]="!cameBack"
      [class.animate-pane-back]="cameBack"
    >
      <button type="button" uiGlassButton round (click)="back()" [attr.aria-label]="'action.back' | t" class="absolute left-0">
        <app-icon name="chevron-left" class="-ml-0.5 size-7" />
      </button>
      <span class="max-w-[calc(100%-7rem)] truncate text-body font-semibold">{{ title() }}</span>
    </div>
    <div class="flex flex-col" [class.animate-pane-in]="!cameBack" [class.animate-pane-back]="cameBack">
      @switch (open) {
        @case ('language') {
          <ui-card>
            @for (language of i18n.languages; track language.code) {
              <button type="button" uiListRow [checked]="language.code === i18n.lang()" (click)="i18n.setLang(language.code); back()">
                {{ language.label }}
              </button>
            }
          </ui-card>
        }
        @case ('users') {
          <app-users-list (picked)="openUser($event)" />
        }
        @case ('user') {
          @if (user(); as user) {
            <app-user-card [user]="user" />
          }
        }
      }
    </div>
  } @else {
    <div class="flex flex-1 flex-col gap-6" [class.animate-pane-back]="cameBack">
      <ui-card>
        <div uiListRow icon="person">{{ auth.email() }}</div>
      </ui-card>

      <!-- Users (the admins only): their list slides in, a user tapped: their card -->
      @if (auth.isAdmin()) {
        <ui-card>
          <button type="button" uiListRow icon="lock" chevron (click)="open('users')">{{ 'users.title' | t }}</button>
        </ui-card>
      }

      <!-- The language: a row (the current one in gray, ›) — its list slides in on a page of its own -->
      <ui-card>
        <button type="button" uiListRow icon="globe" chevron (click)="open('language')">
          {{ 'account.language' | t }}
          <span rowValue class="text-fg-secondary">{{ language() }}</span>
        </button>
      </ui-card>

      <div class="mt-auto flex flex-col gap-3">
        <!-- A new version downloaded: switch to it (the page reloads) -->
        @if (updates.ready()) {
          <ui-card>
            <button type="button" uiListRow icon="update" (click)="updates.apply()"><span class="text-accent">{{ 'account.update' | t }}</span></button>
          </ui-card>
        }
        <ui-card>
          <button type="button" uiListRow icon="logout" danger (click)="auth.logout()">{{ 'account.logout' | t }}</button>
          <button type="button" uiListRow icon="logout-all" danger (click)="auth.logoutEverywhere()">{{ 'account.logoutEverywhere' | t }}</button>
        </ui-card>
      </div>
    </div>
  }
</ui-sheet>
