<ui-sheet [tall]="true" (closed)="closed.emit()">
  @if (page(); as open) {
    <!-- A page in the sheet: ‹ back, its name in the middle; it slides in (back to it: from the left) -->
    <div
      class="relative mb-3 flex h-round shrink-0 items-center justify-center"
      [class.animate-pane-in]="!cameBack"
      [class.animate-pane-back]="cameBack"
    >
      <button type="button" uiFloatingButton round (click)="back()" [attr.aria-label]="'action.back' | t" class="absolute left-0">
        <app-icon name="chevron-left" class="-ml-0.5 size-7" />
      </button>
      <span class="max-w-[calc(100%-7rem)] truncate text-body font-semibold">{{ title() }}</span>
    </div>
    <div class="flex flex-col" [class.animate-pane-in]="!cameBack" [class.animate-pane-back]="cameBack">
      @switch (open) {
        @case ('language') {
          <ui-list>
            @for (language of i18n.languages; track language.code) {
              <button type="button" uiListItem [checked]="language.code === i18n.lang()" (click)="i18n.setLang(language.code); back()">
                {{ language.label }}
              </button>
            }
          </ui-list>
        }
        <!-- (the users' code: downloaded only now, the first time) -->
        @case ('users') {
          @defer {
            <app-users-list (picked)="openUser($event)" />
          }
        }
        @case ('user') {
          @defer {
            <app-user-card [userId]="userId()!" />
          }
        }
      }
    </div>
  } @else {
    <div class="flex flex-1 flex-col gap-6" [class.animate-pane-back]="cameBack">
      <ui-list>
        <div uiListItem icon="person">{{ auth.email() }}</div>
      </ui-list>

      <!-- Users (the admins only: their list slides in, a user tapped: their card); the language (the
           current one in gray, ›: its list slides in) -->
      <ui-list>
        @if (auth.isAdmin()) {
          <button type="button" uiListItem icon="lock" chevron (click)="open('users')">{{ 'users.title' | t }}</button>
        }
        <button type="button" uiListItem icon="globe" chevron (click)="open('language')">
          {{ 'account.language' | t }}
          <span itemValue class="text-fg-secondary">{{ language() }}</span>
        </button>
      </ui-list>

      <div class="mt-auto flex flex-col gap-3">
        <!-- A new version downloaded: switch to it (the page reloads) -->
        @if (updates.ready()) {
          <ui-list>
            <button type="button" uiListItem icon="update" (click)="updates.apply()">{{ 'account.update' | t }}</button>
          </ui-list>
        }
        <ui-list>
          <button type="button" uiListItem icon="logout" danger (click)="auth.logout()">{{ 'account.logout' | t }}</button>
          <button type="button" uiListItem icon="logout-all" danger (click)="auth.logoutEverywhere()">{{ 'account.logoutEverywhere' | t }}</button>
        </ui-list>
      </div>
    </div>
  }
</ui-sheet>
