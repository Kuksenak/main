<ui-sheet #sheet [tall]="true" (closed)="closed.emit()">
  <!-- The field, in the head: a capsule as the round buttons are tall, its loupe at the left -->
  <label sheetHead class="flex h-round w-full items-center gap-2.5 rounded-full bg-sheet-card px-4">
    <app-icon name="search" class="size-5.5 shrink-0 text-icon" />
    <input
      #field
      type="search"
      enterkeyhint="search"
      autocomplete="off"
      [value]="query()"
      (input)="query.set(field.value)"
      [placeholder]="'search.placeholder' | t"
      class="min-w-0 flex-1 bg-transparent text-body text-fg outline-none placeholder:text-fg-secondary"
    />
  </label>

  <!-- What's found: a list per section, its name small and gray over it -->
  <div class="flex flex-col gap-5">
    @for (section of sections(); track section.name) {
      <div class="flex flex-col gap-1.5">
        <span class="px-row-x text-footnote font-medium text-fg-secondary">{{ section.name }}</span>
        <ui-list>
          @for (found of section.items; track found.id) {
            <button type="button" uiListItem [icon]="found.icon" (click)="pick(found, sheet)">
              {{ found.label }}
              @if (found.hint) {
                <span itemValue class="text-fg-secondary">{{ found.hint }}</span>
              }
            </button>
          }
        </ui-list>
      </div>
    } @empty {
      <p class="py-10 text-center text-body text-fg-secondary">{{ 'search.nothing' | t }}</p>
    }
  </div>
</ui-sheet>
