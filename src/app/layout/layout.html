<div class="flex h-dvh flex-col overflow-hidden text-[var(--text)]">
  <header class="sticky top-0 z-10 flex items-center gap-2 bg-[var(--app-bg)] px-4 pb-2 pt-[calc(env(safe-area-inset-top)+0.5rem)]">
    <a routerLink="/about" aria-label="About" class="mr-1 hidden shrink-0 active:opacity-70 sm:block">
      <img src="icons/icon-96x96.png" alt="Logo" class="size-8" width="32" height="32" />
    </a>
    <nav class="flex flex-1 items-center gap-1">
      <a
        routerLink="/schedule"
        routerLinkActive="bg-[var(--accent)] text-[var(--accent-fg)]"
        class="rounded-full px-4 py-1.5 text-[15px] font-medium"
      >Schedule</a>
      <a
        routerLink="/about"
        routerLinkActive="bg-[var(--accent)] text-[var(--accent-fg)]"
        class="rounded-full px-4 py-1.5 text-[15px] font-medium"
      >About</a>
    </nav>
    <span class="hidden max-w-48 truncate text-xs opacity-60 sm:block">{{ auth.email() }}</span>
    <button type="button" (click)="auth.logout()" class="btn-secondary !px-4 !py-1.5">Log out</button>
  </header>

  <router-outlet></router-outlet>

  <!-- Global loading bar — fixed strip at the bottom; components report via LoadingService -->
  <div class="pointer-events-none fixed inset-x-0 bottom-0 z-[2001] h-0.5 overflow-hidden">
    @if (loading.visible()) {
      <div class="h-0.5 w-2/5 rounded-full bg-[var(--accent)] [animation:loadingBar_1.1s_ease-in-out_infinite]"></div>
    }
  </div>
</div>
