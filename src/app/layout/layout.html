<div class="flex h-dvh flex-col overflow-hidden text-[var(--text)]">
  <header class="sticky top-0 z-10 flex items-center gap-2 bg-[var(--app-bg)] px-4 pb-2 pt-[calc(env(safe-area-inset-top)+0.5rem)]">
    <a routerLink="/about" aria-label="About" class="mr-1 hidden shrink-0 active:opacity-70 sm:block">
      <img src="icons/icon-96x96.png" alt="Logo" class="size-8" width="32" height="32" />
    </a>
    <!-- Desktop tabs; on mobile navigation lives in the ⋯ sheet -->
    <nav class="flex min-w-0 flex-1 items-center gap-1">
      <!-- Mobile: the current page's title (e.g. month on Schedule) -->
      <span class="truncate text-xl font-semibold sm:hidden">{{ toolbar.title() }}</span>
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="glass-accent"
          class="hidden h-11 items-center rounded-full px-4 text-[17px] font-medium sm:inline-flex"
        >{{ item.label }}</a>
      }
    </nav>
    <button type="button" (click)="navOpen.set(true)" aria-label="Menu" class="icon-btn !text-current sm:hidden">
      <svg viewBox="0 0 24 24" fill="currentColor" class="size-5"><circle cx="5" cy="5" r="2" /><circle cx="12" cy="5" r="2" /><circle cx="19" cy="5" r="2" /><circle cx="5" cy="12" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="19" cy="12" r="2" /><circle cx="5" cy="19" r="2" /><circle cx="12" cy="19" r="2" /><circle cx="19" cy="19" r="2" /></svg>
    </button>
    <!-- Account avatar: first letter of the email; dot when an app update is ready -->
    <button
      #avatarBtn
      type="button"
      (click)="accountOpen.set(true)"
      aria-label="Account"
      class="relative flex size-11 shrink-0 items-center justify-center rounded-full active:opacity-70"
    >
      <span class="glass-accent flex size-11 items-center justify-center rounded-full text-[19px] font-semibold uppercase">{{ initial() }}</span>
      @if (updates.updateReady()) {
        <span class="absolute right-0 top-0 size-3 rounded-full bg-red-500 ring-2 ring-[var(--app-bg)]"></span>
      }
    </button>
  </header>

  <router-outlet></router-outlet>

  @if (navOpen()) {
    <app-sheet #navSheet (closed)="navOpen.set(false)">
      <div class="ios-group">
        @for (item of navItems; track item.path) {
          <button type="button" (click)="go(item.path, navSheet)" class="ios-row h-11 w-full !py-0 text-left active:opacity-60">
            <span class="text-[17px]">{{ item.label }}</span>
            @if (isActive(item.path)) {
              <svg viewBox="0 0 24 24" fill="none" class="size-5 text-[var(--accent)]" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7" /></svg>
            }
          </button>
        }
      </div>
    </app-sheet>
  }

  @if (accountOpen()) {
    <app-sheet #sheet [origin]="avatarBtn" (closed)="accountOpen.set(false)">
      <div class="flex min-h-full flex-col gap-6 sm:gap-2">
        <div class="ios-group">
          <div class="ios-row h-11 !py-0">
            <span class="min-w-0 truncate text-[17px]">{{ auth.email() }}</span>
          </div>
          @if (updates.updateReady()) {
            <button type="button" (click)="updates.apply()" class="ios-row h-11 w-full !py-0 text-left active:opacity-60">
              <span class="flex items-center gap-2 text-[17px] font-semibold text-[var(--accent)]">
                <span class="size-2 rounded-full bg-red-500"></span>
                Update available
              </span>
              <span class="text-[15px] opacity-50">Restart</span>
            </button>
          }
          <div class="ios-row h-11 !py-0">
            <span class="text-[17px]">Version</span>
            <span class="text-[17px] tabular-nums opacity-50">{{ updates.version }}</span>
          </div>
        </div>

        <button type="button" (click)="logout(sheet)" class="ios-group mt-auto flex h-11 w-full shrink-0 items-center justify-center text-[17px] font-semibold text-red-500 active:opacity-60">Log out</button>
      </div>
    </app-sheet>
  }

  <!-- Global loading bar — fixed strip at the bottom; components report via LoadingService -->
  <div class="pointer-events-none fixed inset-x-0 bottom-0 z-[2001] h-0.5 overflow-hidden">
    @if (loading.visible()) {
      <div class="h-0.5 w-2/5 rounded-full bg-[var(--accent)] [animation:loadingBar_1.1s_ease-in-out_infinite]"></div>
    }
  </div>
</div>
