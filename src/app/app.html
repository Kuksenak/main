@if (!auth.initialized()) {
  <main class="min-h-dvh flex items-center justify-center text-[var(--text)]">
    <p class="text-sm opacity-40">Loading…</p>
  </main>
} @else {
  <router-outlet></router-outlet>
}

@if (updateReady()) {
  <button
    type="button"
    (click)="reload()"
    class="fixed left-1/2 top-[calc(env(safe-area-inset-top)+0.5rem)] z-[2000] -translate-x-1/2 rounded-full border border-white/40 bg-white/50 px-4 py-1.5 text-xs font-semibold text-neutral-900 shadow-lg backdrop-blur-xl backdrop-saturate-150 active:opacity-80 dark:border-white/15 dark:bg-neutral-800/50 dark:text-white"
  >
    Update available
  </button>
}
