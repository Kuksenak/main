@if (!auth.initialized()) {
  <main class="flex h-full items-center justify-center text-fg">
    <p class="text-sm opacity-40">{{ 'app.loading' | t }}</p>
  </main>
} @else {
  <router-outlet></router-outlet>
}

<!-- Phones in landscape: the app is portrait-only (see index.html) -->
<div class="rotate-hint">
  <!-- A phone (drawn as the icons are: a marker outline, its screen a pastel) turning from
       landscape back to portrait, on a loop -->
  <svg viewBox="0 0 64 64" class="size-20 text-fg" aria-hidden="true">
    <g class="origin-center animate-rotate-back [transform-box:fill-box]" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24.8 19.4 39.6 19.2 39.8 44.6 24.9 44.8z" fill="#C5DAD8" stroke="none" transform="translate(1 .8)" />
      <path d="M25.6 12.6C29.8 12.3 34.4 12.4 38.6 12.5 41.4 12.6 42.6 13.8 42.6 16.6 42.4 26.4 42.5 37.6 42.7 47.4 42.7 50.2 41.4 51.4 38.6 51.4 34.4 51.6 29.6 51.5 25.4 51.6 22.6 51.6 21.4 50.4 21.4 47.6 21.6 37.6 21.5 26.4 21.4 16.8 21.4 14 22.8 12.7 25.8 12.8" />
      <path d="M29.4 16.2C31 16.1 32.8 16.2 34.6 16.1" stroke-width="2" />
      <path d="M30.2 47.9C31.4 47.8 32.6 47.9 33.8 47.8" stroke-width="2" />
    </g>
  </svg>
  <p class="text-body font-medium">{{ 'app.rotate' | t }}</p>
</div>
