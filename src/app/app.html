@if (!auth.initialized()) {
  <main class="min-h-dvh flex items-center justify-center text-neutral-900 dark:text-neutral-100">
    <p class="text-sm opacity-40">Loading…</p>
  </main>
} @else {
  <router-outlet></router-outlet>
}

@if (updateReady()) {
  <button
    type="button"
    (click)="reload()"
    class="fixed left-1/2 top-[calc(env(safe-area-inset-top)+0.75rem)] z-[2000] -translate-x-1/2 rounded-full bg-neutral-900 px-5 py-2 text-sm font-semibold text-white shadow-xl active:opacity-80 dark:bg-white dark:text-neutral-900"
  >
    Update
  </button>
}
