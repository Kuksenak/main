@if (!auth.initialized()) {
  <main class="flex h-full items-center justify-center text-[var(--text)]">
    <p class="text-sm opacity-40">{{ 'app.loading' | t }}</p>
  </main>
} @else {
  <router-outlet></router-outlet>
}

<!-- Phones in landscape: the app is portrait-only (see index.html) -->
<div class="rotate-hint">
  <!-- A phone turning from landscape back to portrait, on a loop -->
  <svg viewBox="0 0 64 64" class="size-20" aria-hidden="true">
    <path d="M10 22a24 24 0 0 1 22-14" fill="none" stroke-width="3" stroke-linecap="round" style="stroke: var(--brand-orange)" />
    <path d="M27 3.5 32.5 8 27.5 13" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--brand-orange)" />
    <g class="rotate-hint-phone">
      <rect x="21" y="19" width="22" height="38" rx="5" fill="none" stroke-width="3" style="stroke: var(--brand-blue)" />
      <rect x="28.5" y="23" width="7" height="2" rx="1" style="fill: var(--brand-blue)" />
    </g>
  </svg>
  <p class="text-body font-medium">{{ 'app.rotate' | t }}</p>
</div>
