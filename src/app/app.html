<!-- The icons' hand-drawn wobble (core/ui/icon): their lines bent a little by a slow noise, in the
     icon's own 24×24 units, so it looks the same at any size -->
<svg width="0" height="0" class="absolute" aria-hidden="true">
  <filter id="hand-drawn" filterUnits="userSpaceOnUse" x="-2" y="-2" width="28" height="28">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="7" />
    <feDisplacementMap in="SourceGraphic" scale="1.4" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

@if (!auth.initialized()) {
  <main class="flex h-full items-center justify-center text-fg">
    <p class="text-sm opacity-40">{{ 'app.loading' | t }}</p>
  </main>
} @else {
  <router-outlet></router-outlet>
}

<!-- Phones in landscape: the app is portrait-only (see index.html) -->
<div class="rotate-hint">
  <!-- A gray phone turning from landscape back to portrait, on a loop -->
  <svg viewBox="0 0 64 64" class="size-20 text-fg-secondary" aria-hidden="true">
    <g class="origin-center animate-rotate-back [transform-box:fill-box]">
      <rect x="21" y="13" width="22" height="38" rx="5" fill="none" stroke-width="3" stroke="currentColor" />
      <rect x="28.5" y="17" width="7" height="2" rx="1" fill="currentColor" />
    </g>
  </svg>
  <p class="text-body font-medium">{{ 'app.rotate' | t }}</p>
</div>
