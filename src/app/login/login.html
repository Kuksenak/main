<main
  class="flex h-full flex-col px-6 pb-[max(1.5rem,env(safe-area-inset-bottom))] pt-[calc(env(safe-area-inset-top)+3rem)] text-fg"
>
  <!-- Brand: the signpost, grass at its foot (drawn as the icons are: the dark theme turns it
       over), just over the buttons — no name under it (the name: for screen readers) -->
  <header class="mt-auto flex flex-col items-center">
    <h1 class="sr-only">{{ appName }}</h1>
    <img src="login-hero.svg" alt="" class="w-44 select-none dark:invert dark:hue-rotate-180" width="176" height="194" draggable="false" />
  </header>

  <!-- Sign-in actions anchored to the bottom -->
  <div class="mx-auto mt-10 flex w-full max-w-72 flex-col gap-3">
    <!-- The API is down: our message instead of the host's error page -->
    @if (auth.loginError() || (denied && !auth.loggingIn())) {
      <!-- Or back from Google without a sign-in -->
      <p class="text-footnote rounded-card bg-danger/12 px-4 py-3 text-center text-danger">
        {{ (auth.loginError() ? 'login.unavailable' : deniedKey) | t }}
      </p>
    }
    <button type="button" (click)="auth.login()" [disabled]="auth.loggingIn()" class="btn-strong w-full">
      <app-icon name="google" class="size-5" />
      {{ 'login.google' | t }}
    </button>
    <!-- Placeholder until Sign in with Apple is implemented -->
    <button type="button" class="btn-strong w-full">
      <app-icon name="apple" class="size-5" />
      {{ 'login.apple' | t }}
    </button>

    <p class="text-footnote mt-2 text-center leading-relaxed opacity-50">
      {{ 'login.legalPrefix' | t }}
      <span class="underline">{{ 'login.terms' | t }}</span>
      {{ 'login.and' | t }}
      <span class="underline">{{ 'login.privacy' | t }}</span>.
    </p>
  </div>
</main>
