<!-- The background (as craft.do's, in layers, all our own drawings): a sky gradient, a white haze
     towards the bottom, a paper grain over it, clouds peeking in at the sides and a hand-drawn line
     along the bottom -->
<div aria-hidden="true" class="login-bg pointer-events-none fixed inset-0 -z-0 overflow-hidden">
  <div class="absolute inset-0 bg-[linear-gradient(to_bottom,var(--login-sky-top),var(--login-sky-bottom))]"></div>
  <div class="login-haze absolute inset-0 bg-[linear-gradient(to_bottom,transparent,white)] opacity-30"></div>
  <div class="login-grain absolute inset-0 opacity-50 mix-blend-overlay"></div>

  <!-- Clouds: soft white puffs, one low at the left, one high at the right -->
  <svg class="login-cloud absolute -left-24 bottom-[18%] w-[360px] md:w-[480px]" viewBox="0 0 480 250" fill="none">
    <g filter="url(#cloudBlur)">
      <ellipse cx="160" cy="170" rx="150" ry="58" />
      <ellipse cx="230" cy="125" rx="95" ry="70" />
      <ellipse cx="320" cy="160" rx="120" ry="55" />
      <ellipse cx="120" cy="130" rx="70" ry="50" />
    </g>
    <defs>
      <filter id="cloudBlur" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="6" /></filter>
    </defs>
  </svg>
  <svg class="login-cloud absolute -right-28 top-[12%] w-[360px] md:w-[480px]" viewBox="0 0 480 250" fill="none">
    <g filter="url(#cloudBlur2)">
      <ellipse cx="300" cy="165" rx="150" ry="55" />
      <ellipse cx="230" cy="120" rx="90" ry="68" />
      <ellipse cx="150" cy="160" rx="110" ry="50" />
      <ellipse cx="350" cy="125" rx="75" ry="52" />
    </g>
    <defs>
      <filter id="cloudBlur2" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="6" /></filter>
    </defs>
  </svg>

  <!-- A hand-drawn line along the bottom: loops and waves -->
  <svg class="login-line absolute inset-x-0 bottom-0 h-[38%] w-full" viewBox="0 0 1440 300" preserveAspectRatio="xMidYMax slice" fill="none">
    <path
      d="M-20 230 C 80 180, 160 260, 250 210 S 380 120, 430 190 S 520 280, 600 220 C 650 180, 700 120, 760 150 C 820 180, 790 250, 730 240 C 670 230, 700 150, 780 140 C 880 128, 930 230, 1030 220 S 1160 140, 1230 180 S 1340 260, 1460 200"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M-20 268 C 120 250, 260 285, 420 262 S 700 240, 860 266 S 1180 284, 1460 254"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      opacity="0.6"
    />
  </svg>
</div>

<main
  class="relative z-10 flex h-full flex-col px-6 pb-[max(1.5rem,env(safe-area-inset-bottom))] pt-[calc(env(safe-area-inset-top)+3rem)] text-[var(--text)]"
>
  <!-- Brand at the very top -->
  <header class="flex flex-col items-center gap-3">
    <img src="logo.png" [alt]="'app.name' | t" class="size-20" width="80" height="80" />
    <h1 class="text-2xl font-semibold">{{ 'app.name' | t }}</h1>
  </header>

  <!-- Sign-in actions anchored to the bottom -->
  <div class="mx-auto mt-auto flex w-full max-w-sm flex-col gap-3">
    <!-- The API is down: our message instead of the host's error page -->
    @if (auth.loginError() || (denied && !auth.loggingIn())) {
      <!-- Or back from Google without a sign-in -->
      <p class="text-footnote rounded-[var(--radius-card)] bg-[color-mix(in_srgb,var(--danger)_12%,transparent)] px-4 py-3 text-center text-[var(--danger)]">
        {{ (auth.loginError() ? 'login.unavailable' : 'login.denied') | t }}
      </p>
    }
    <button type="button" (click)="auth.login()" [disabled]="auth.loggingIn()" class="btn-strong w-full">
      <app-icon name="google" class="size-5" />
      {{ 'login.google' | t }}
    </button>
    <!-- Placeholder until Sign in with Apple is implemented -->
    <button type="button" class="btn-strong w-full">
      <app-icon name="apple" class="size-5" />
      {{ 'login.apple' | t }}
    </button>

    <p class="text-footnote mt-2 text-center leading-relaxed opacity-50">
      {{ 'login.legalPrefix' | t }}
      <span class="underline">{{ 'login.terms' | t }}</span>
      {{ 'login.and' | t }}
      <span class="underline">{{ 'login.privacy' | t }}</span>.
    </p>
  </div>
</main>
