<!-- The account's tags: a window as the search's — the field at the top (it filters the tags; ↵ makes a
     new one by what's typed), a row each: its color's swatch (a click: the colors under it), its name
     a field (typed over right there), Delete under the pointer; the keys at the bottom. -->
<ui-window (closed)="closed.emit()">
  <ui-window-head icon="hash">
    <input #field uiWindowField [value]="query()" (input)="query.set(field.value)" (keydown.enter)="create()" [placeholder]="'tags.find' | t" />
  </ui-window-head>

  <div class="flex min-h-0 flex-1 flex-col overflow-y-auto px-3.5 pt-1 pb-2">
    @for (tag of shown(); track tag.id) {
      <div uiRow>
        <button
          rowStart
          type="button"
          [attr.data-tag]="tag.color"
          (click)="paletteFor.set(paletteFor() === tag.id ? null : tag.id)"
          [attr.aria-expanded]="paletteFor() === tag.id"
          [uiTip]="'tags.color' | t"
          [attr.aria-label]="'tags.color' | t"
          class="grid size-5 shrink-0 place-items-center"
        >
          <span class="size-3.5 rounded-[0.25rem] bg-tag"></span>
        </button>
        <!-- (its name: Enter or away — saved, Esc — as it was) -->
        <input
          #name
          type="text"
          maxlength="40"
          [value]="tag.name"
          (keydown.enter)="name.blur()"
          (keydown.escape)="$event.stopPropagation(); name.value = tag.name; name.blur()"
          (blur)="rename(tag, name)"
          [attr.aria-label]="'tags.rename' | t"
          class="h-7 w-full min-w-0 rounded-md bg-transparent px-1 align-middle text-ui text-side-text outline-none focus:bg-tint"
        />
        <button
          rowEnd
          uiButton
          type="button"
          icon="trash"
          (click)="remove(tag, $event)"
          [uiTip]="'tags.delete' | t"
          [attr.aria-label]="'tags.delete' | t"
        ></button>
      </div>
      @if (paletteFor() === tag.id) {
        <!-- (its colors, a swatch each — the one it has ringed) -->
        <div class="flex gap-1.5 pt-1 pb-2 pl-9">
          @for (color of colors; track color) {
            <button
              type="button"
              [attr.data-tag]="color"
              (click)="recolor(tag, color)"
              [attr.aria-pressed]="tag.color === color"
              [uiTip]="colorLabel(color) | t"
              [attr.aria-label]="colorLabel(color) | t"
              class="size-5 rounded-[0.3rem] bg-tag outline-fg/20 outline-offset-2 hover:brightness-95 aria-pressed:outline-2"
            ></button>
          }
        </div>
      }
    }
    @if (query().trim() && !exact()) {
      <!-- (a name none has: ↵ — or a click here — makes it) -->
      <button type="button" uiRow icon="plus" (click)="create()">
        {{ 'tags.create' | t }}
        <ui-tag class="ml-1.5" [color]="store.nextColor()">{{ query().trim() }}</ui-tag>
      </button>
    } @else if (!shown().length) {
      <ui-empty class="m-auto">{{ (query().trim() ? 'search.nothing' : 'tags.emptyHere') | t }}</ui-empty>
    }
  </div>

  <ui-window-foot>
    <ui-window-key key="Esc">{{ 'search.close' | t }}</ui-window-key>
    <ui-window-key [icons]="['enter']">{{ 'tags.create' | t }}</ui-window-key>
  </ui-window-foot>
</ui-window>
