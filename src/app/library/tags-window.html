<!-- The account's tags: a row each, the whole of it in its color — its name a field (typed over right
     there), ⋯ at the right: its menu — its colors (a swatch each, ✓ the one it has), Delete (asked
     first). None yet: a word on where they're made. -->
<ui-window (closed)="closed.emit()">
  <div class="flex h-12 shrink-0 items-center gap-3 px-4.5">
    <app-icon name="hash" class="size-5 shrink-0 text-icon" />
    <span class="flex-1 text-base text-fg">{{ 'tags.title' | t }}</span>
  </div>
  <div class="flex min-h-0 flex-1 flex-col overflow-y-auto px-3.5 pb-3">
    @for (tag of store.tags(); track tag.id) {
      <!-- (a row: the whole of it in the tag's color; its name a field right there — Enter or away:
           saved, Esc: as it was) -->
      <div class="mb-1 flex h-10 shrink-0 items-center gap-2 rounded-xl pr-1 pl-3" [class]="chip(tag.color)">
        <input
          #name
          type="text"
          maxlength="40"
          [value]="tag.name"
          (keydown.enter)="name.blur()"
          (keydown.escape)="name.value = tag.name; name.blur()"
          (blur)="rename(tag, name)"
          [attr.aria-label]="'tags.rename' | t"
          class="h-8 min-w-0 flex-1 bg-transparent text-ui text-current outline-none"
        />
        <button
          #more
          uiButton
          type="button"
          icon="dots"
          (click)="menuFor.set(menuFor()?.tag?.id === tag.id ? null : { tag, at: more.element })"
          [attr.aria-expanded]="menuFor()?.tag?.id === tag.id"
          [attr.aria-label]="'library.more' | t"
        ></button>
      </div>
    } @empty {
      <p class="m-auto py-10 text-center text-ui text-fg-secondary">{{ 'tags.empty' | t }}</p>
    }
  </div>
</ui-window>

<!-- A tag's ⋯: its colors; Delete (asked first) -->
@if (menuFor(); as m) {
  <ui-menu narrow [origin]="m.at" (closed)="menuFor.set(null)">
    <ui-menu-label>{{ 'tags.color' | t }}</ui-menu-label>
    @for (color of colors; track color) {
      <button type="button" uiMenuItem [checked]="m.tag.color === color" (click)="recolor(m.tag, color)">
        <span class="flex items-center gap-2.5">
          <span class="size-4 shrink-0 rounded-[0.3rem]" [class]="swatch[color]"></span>
          {{ colorLabel[color] | t }}
        </span>
      </button>
    }
    <ui-menu-separator />
    <button type="button" uiMenuItem icon="trash" danger (click)="remove(m.tag, m.at)">{{ 'tags.delete' | t }}</button>
  </ui-menu>
}
