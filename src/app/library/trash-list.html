<!-- The pages in the trash: each its name, when it was thrown away; Restore and Delete forever (desktops:
     buttons at its right under the pointer; phones: swiped right / left); Delete forever asked first: it can't be undone; Empty trash: where it's shown -->
@if (shown(); as items) {
  @if (!items.length) {
    <ui-empty>{{ (query().trim() ? 'search.nothing' : 'trash.empty') | t }}</ui-empty>
  } @else {
    <div class="flex flex-col desktop:gap-0.5">
      @for (item of items; track item.id; let i = $index) {
        @if (desktop) {
          <!-- (the desktop's window: the keys pick one — gray, its buttons shown) -->
          <div
            uiRow
            icon="page"
            [hint]="when(item.deletedAt)"
            [hover]="index() === null"
            [attr.aria-selected]="index() === null ? null : i === index()"
            (mouseenter)="index() !== null && index.set(i)"
          >
            {{ item.title }}
            <button rowEnd uiButton type="button" icon="update" (click)="restore(item.id)" [uiTip]="'trash.restore' | t" [attr.aria-label]="'trash.restore' | t"></button>
            <button rowEnd uiButton type="button" icon="trash" (click)="deleteForever(item.id, $event.currentTarget)" [uiTip]="'trash.deleteForever' | t" [attr.aria-label]="'trash.deleteForever' | t"></button>
          </div>
        } @else {
          <!-- (phones, as iOS's lists: swiped right — Restore; left — Delete forever, asked first) -->
          <ui-swipe [start]="'trash.restore' | t" [end]="'trash.deleteForever' | t" (startPicked)="restore(item.id)" (endPicked)="deleteForever(item.id, $event)">
            <div uiRow icon="page">
              {{ item.title }}
              <!-- (when it was thrown away, at the right: the day over the time) -->
              <span rowEnd class="flex flex-col items-end text-footnote leading-tight text-fg-secondary tabular-nums">
                <span>{{ when(item.deletedAt) }}</span>
                <span>{{ time(item.deletedAt) }}</span>
              </span>
            </div>
          </ui-swipe>
        }
      }
    </div>
  }
}
