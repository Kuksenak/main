<!-- The pages in the trash: each its name, when it was thrown away; Restore and Delete forever at its
     right (desktops: under the pointer; phones: as big as the round buttons); Delete forever asked first: it can't be undone; Empty trash: where it's shown -->
@if (shown(); as items) {
  @if (!items.length) {
    <ui-empty>{{ (query().trim() ? 'search.nothing' : 'trash.empty') | t }}</ui-empty>
  } @else {
    <div class="flex flex-col desktop:gap-0.5">
      @for (item of items; track item.id; let i = $index) {
        <!-- (the desktop's window: the keys pick one — gray, its buttons shown) -->
        <div
          uiRow
          icon="page"
          [hint]="when(item.deletedAt)"
          [hover]="index() === null"
          [attr.aria-selected]="index() === null ? null : i === index()"
          (mouseenter)="index() !== null && index.set(i)"
        >
          {{ item.title }}
          <button
            rowEnd
            uiButton
            type="button"
            icon="update"
            (click)="restore(item.id)"
            class="mobile:size-11!"
            [uiTip]="'trash.restore' | t"
            [attr.aria-label]="'trash.restore' | t"
          ></button>
          <button
            rowEnd
            uiButton
            type="button"
            icon="trash"
            (click)="deleteForever(item.id, $event)"
            class="mobile:size-11!"
            [uiTip]="'trash.deleteForever' | t"
            [attr.aria-label]="'trash.deleteForever' | t"
          ></button>
        </div>
      }
    </div>
  }
}
