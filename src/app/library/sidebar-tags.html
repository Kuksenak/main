<!-- Tags, as a place's row: # Tags, ⌄ / › after the name (folds them); + under the pointer, by the ⌄ (a new one) — its
     own button over the row (a button in a button: not allowed) -->
<div class="group/row relative flex shrink-0 flex-col">
  <button uiSidebarItem icon="hash" (click)="fold()" [attr.data-open]="folded() ? null : ''" class="group/fold">
    <!-- (as Notion's: ⌄ right after the name, under the pointer — › folded) -->
    <span class="inline-flex max-w-full items-center gap-1 align-middle"><span class="truncate">{{ 'tags.title' | t }}</span><app-icon name="chevron-down" class="size-3.5 shrink-0 text-icon opacity-0 transition -rotate-90 group-hover/fold:opacity-100 group-data-open/fold:rotate-0" /></span>
  </button>
  <button
    uiSidebarAction
    icon="plus"
    (click)="startAdding()"
    [uiTip]="'tags.newOne' | t"
    [attr.aria-label]="'tags.newOne' | t"
    class="absolute top-1/2 right-7 -translate-y-1/2"
  ></button>
</div>

@if (!folded()) {
  @if (adding()) {
    <!-- (a new one's name: Enter makes it, Esc / away — not) -->
    <div class="flex h-side-row shrink-0 items-center gap-2 pr-side-row-x pl-3.5">
      <span class="size-3 shrink-0 rounded-[0.25rem] bg-tag saturate-[2.5] brightness-95" [attr.data-tag]="store.nextColor()"></span>
      <input
        #field
        type="text"
        maxlength="40"
        [placeholder]="'tags.new' | t"
        (keydown.enter)="add(field)"
        (keydown.escape)="adding.set(false)"
        (blur)="adding.set(false)"
        class="h-6 min-w-0 flex-1 rounded-md bg-dialog px-1.5 text-ui text-fg outline-none ring-1 ring-separator placeholder:text-fg-secondary"
      />
    </div>
  }
  @for (tag of store.tags(); track tag.id) {
    <!-- (a row: its swatch, its name — a click: its pages; a page dropped here: tagged so) -->
    <div
      role="link"
      tabindex="0"
      (click)="renaming() === tag.id ? null : open(tag)"
      (keydown.enter)="open(tag)"
      (dragover)="over($event, tag)"
      (dragleave)="dropOn.set(null)"
      (drop)="drop($event, tag)"
      [attr.aria-current]="current() === tag.id ? 'page' : null"
      [attr.data-drop]="dropOn() === tag.id ? '' : null"
      class="group/row flex h-side-row shrink-0 cursor-pointer items-center gap-2 rounded-side-row pr-side-row-x pl-3.5 text-ui text-side-text outline-none
             hover:bg-side-hover focus-visible:bg-side-hover aria-[current=page]:bg-side-on aria-[current=page]:text-fg data-drop:bg-side-on"
    >
      <span class="size-3 shrink-0 rounded-[0.25rem] bg-tag saturate-[2.5] brightness-95" [attr.data-tag]="tag.color"></span>
      @if (renaming() === tag.id) {
        <input
          #field
          type="text"
          maxlength="40"
          [value]="tag.name"
          (click)="$event.stopPropagation()"
          (keydown.enter)="field.blur()"
          (keydown.escape)="field.value = tag.name; field.blur()"
          (blur)="rename(tag, field)"
          class="h-6 min-w-0 flex-1 rounded-md bg-dialog px-1.5 text-ui text-fg outline-none ring-1 ring-separator"
        />
      } @else {
        <span class="min-w-0 flex-1 truncate">{{ tag.name }}</span>
        <button
          uiSidebarAction
          #more
          icon="dots"
          (click)="menuFor.set(menuFor()?.tag?.id === tag.id ? null : { tag, at: more.element })"
          [attr.aria-expanded]="menuFor()?.tag?.id === tag.id"
          [attr.aria-label]="'library.more' | t"
        ></button>
      }
    </div>
  }
}

<!-- A tag's ⋯: Rename; its colors; Delete (asked first) -->
@if (menuFor(); as m) {
  <ui-menu narrow [origin]="m.at" (closed)="menuFor.set(null)">
    <button type="button" uiMenuItem icon="pencil" (click)="renaming.set(m.tag.id)">{{ 'tags.rename' | t }}</button>
    <ui-menu-separator />
    <ui-menu-label>{{ 'tags.color' | t }}</ui-menu-label>
    @for (color of colors; track color) {
      <button type="button" uiMenuItem [checked]="m.tag.color === color" (click)="recolor(m.tag, color)">
        <span class="flex items-center gap-2.5">
          <span class="size-4 shrink-0 rounded-[0.3rem] bg-tag" [attr.data-tag]="color"></span>
          {{ colorLabel(color) | t }}
        </span>
      </button>
    }
    <ui-menu-separator />
    <button type="button" uiMenuItem icon="trash" danger (click)="remove(m.tag, m.at)">{{ 'tags.delete' | t }}</button>
  </ui-menu>
}
