<!-- Tags, as a place's row (as Favorites'): # Tags, ⌄ right after the name under the pointer (› folded) —
     a click folds them; + at its right under the pointer, as Library's (a new one) -->
<a uiSidebarItem icon="hash" role="button" tabindex="0" (click)="folds.toggle('tags')" (keydown.enter)="folds.toggle('tags')" [attr.data-open]="folds.has('tags') ? null : ''" class="group/fold shrink-0 cursor-pointer">
  <ui-fold-name>{{ 'tags.title' | t }}</ui-fold-name>
  <button itemEnd uiSidebarAction icon="plus" (click)="startAdding()" [uiTip]="'tags.newOne' | t" [attr.aria-label]="'tags.newOne' | t"></button>
</a>

@if (!folds.has('tags')) {
  <!-- (its rows scroll on their own, as the favorites: fading out at the bottom; scrolled — a hairline
       over them, their top fading too; the bar over them) -->
  <div uiSidebarScroll>
    @if (adding()) {
      <!-- (a new one's name: Enter makes it, Esc / away — not) -->
      <div class="flex h-side-row shrink-0 items-center gap-2 pr-side-row-x pl-3.5">
        <span class="grid size-icon-side shrink-0 place-items-center"><ui-tag-swatch [color]="store.nextColor()" class="size-3" /></span>
        <input
          #field
          uiSidebarField
          maxlength="40"
          [placeholder]="'tags.new' | t"
          (keydown.enter)="add(field)"
          (keydown.escape)="adding.set(false)"
          (blur)="adding.set(false)"
        />
      </div>
    }
    @for (tag of store.tags(); track tag.id) {
      <!-- (a row: its swatch, its name — a click: its pages; a page dropped here: tagged so) -->
      <div
        uiSidebarRow
        role="link"
        tabindex="0"
        (click)="renaming() === tag.id ? null : open(tag)"
        (keydown.enter)="open(tag)"
        (dragover)="over($event, tag)"
        (dragleave)="dropOn.set(null)"
        (drop)="drop($event, tag)"
        [attr.aria-current]="current() === tag.id ? 'page' : null"
        [attr.data-drop]="dropOn() === tag.id ? '' : null"
        class="cursor-pointer pl-3.5! data-drop:bg-tint-strong"
      >
        <!-- (its swatch in an icon's room: the names in line with the pages') -->
        <span class="grid size-icon-side shrink-0 place-items-center"><ui-tag-swatch [color]="tag.color" class="size-3" /></span>
        @if (renaming() === tag.id) {
          <input
            #field
            uiSidebarField
            maxlength="40"
            [value]="tag.name"
            (click)="$event.stopPropagation()"
            (keydown.enter)="field.blur()"
            (keydown.escape)="field.value = tag.name; field.blur()"
            (blur)="rename(tag, field)"
          />
        } @else {
          <span class="min-w-0 flex-1 truncate">{{ tag.name }}</span>
          <button
            uiSidebarAction
            #more
            icon="dots"
            (click)="menuFor.set(menuFor()?.tag?.id === tag.id ? null : { tag, at: more.element })"
            [attr.aria-expanded]="menuFor()?.tag?.id === tag.id"
            [attr.aria-label]="'library.more' | t"
          ></button>
        }
      </div>
    }

  </div>
}

<!-- A tag's ⋯, as Finder's: Rename; its colors in one row of dots (the chosen one ringed, a hint names
     each — a click recolors it, the menu goes); Delete (asked first) -->
@if (menuFor(); as m) {
  <ui-menu narrow [origin]="m.at" (closed)="closeMenu()">
    <button type="button" uiMenuItem icon="pencil" (click)="renaming.set(m.tag.id)">{{ 'tags.rename' | t }}</button>
    <div class="flex items-center gap-0.5 px-1.5 py-1" role="radiogroup" [attr.aria-label]="'tags.color' | t">
      @for (color of colors; track color) {
        <button
          type="button"
          role="menuitemradio"
          [attr.aria-checked]="m.tag.color === color"
          [attr.aria-label]="colorLabel(color) | t"
          [uiTip]="colorLabel(color) | t"
          (click)="store.recolor(m.tag, color)"
          class="group/dot grid size-6 place-items-center rounded-full outline-none"
        >
          <ui-tag-swatch
            [color]="color"
            class="size-3.5 transition-transform group-hover/dot:scale-125 group-focus-visible/dot:scale-125 group-aria-checked/dot:ring-2 group-aria-checked/dot:ring-fg/30 group-aria-checked/dot:ring-offset-2 group-aria-checked/dot:ring-offset-menu"
          />
        </button>
      }
    </div>
    <ui-menu-separator />
    <button type="button" uiMenuItem icon="trash" danger (click)="remove(m.tag, m.at)">{{ 'tags.delete' | t }}</button>
  </ui-menu>
}
