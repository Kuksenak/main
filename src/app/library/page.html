<div class="flex flex-col gap-3 px-4 pt-2 pb-10 desktop:max-w-3xl desktop:px-10 desktop:pt-8">

  @if (page()) {
    <!-- Desktop: the state of the saving, Delete at the right -->
    <div class="flex h-button items-center justify-end gap-2 text-footnote text-fg-secondary mobile:hidden">
      @if (saving()) {
        <span>{{ 'library.saving' | t }}</span>
      }
      <button uiButton type="button" icon="sparkle" (click)="aiOpen.set(!aiOpen())">{{ 'editor.ai' | t }}</button>
      <button uiButton type="button" icon="trash" (click)="delete()">{{ 'library.delete' | t }}</button>
    </div>


    <!-- The title: big, no box (as Notion's) -->
    <input
      #titleField
      type="text"
      [value]="title()"
      (input)="typedTitle(titleField.value)"
      (keydown.enter)="titleEnter($event)"
      [placeholder]="'library.untitled' | t"
      maxlength="200"
      class="w-full bg-transparent text-[1.75rem] leading-tight font-semibold text-fg outline-none placeholder:text-fg-secondary desktop:text-[2rem]"
    />

    <!-- The text: blocks, written right on the page -->
    <app-page-editor [blocks]="texts" (changed)="typedBlocks($event)" (ai)="aiOpen.set(true)" />

    <!-- Phones: Delete at the bottom -->
    <button uiButton type="button" icon="trash" (click)="delete()" class="self-start desktop:hidden">{{ 'library.delete' | t }}</button>
  }
</div>

<!-- The AI's chat: a panel at the right (desktop), a sheet (phones) -->
@if (aiOpen() && page(); as p) {
  @if (desktop) {
    <aside class="fixed inset-y-0 right-0 z-40 flex w-[26rem] max-w-full animate-menu-in flex-col gap-3 border-l-[0.5px] border-separator bg-app p-4 shadow-popover">
      <div class="flex h-button items-center gap-2">
        <span class="flex-1 text-body font-medium">{{ 'editor.ai' | t }}</span>
        <button uiButton type="button" icon="close" (click)="aiOpen.set(false)" [attr.aria-label]="'search.close' | t"></button>
      </div>
      <app-ai-chat [pageId]="p.id" [page]="pageText()" (add)="editor()?.insert($event)" />
    </aside>
  } @else {
    <ui-sheet [tall]="true" (closed)="aiOpen.set(false)">
      <span sheetHead class="text-body font-semibold">{{ 'editor.ai' | t }}</span>
      <app-ai-chat [pageId]="p.id" [page]="pageText()" (add)="editor()?.insert($event)" />
    </ui-sheet>
  }
}
