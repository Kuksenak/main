<!-- Phones: a tag's pages (a tap opens one); its name, color and Delete: the tags' Edit -->
@if (tag(); as t) {
  <div class="flex flex-col gap-2 px-4 pt-2 pb-24">
    <ui-list>
      @for (page of pages(); track page.id) {
        <button type="button" uiListItem icon="page" [tint]="tint(t)" chevron (click)="openPage(page.id)">{{ page.title }}</button>
      } @empty {
        <div uiListItem><span class="text-fg-secondary">{{ 'tags.noPages' | t }}</span></div>
      }
    </ui-list>
  </div>
}
