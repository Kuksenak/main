<!-- Phones: a tag's page — its pages (a tap opens one), its color (a tap: a wheel under the row, as
     the users' limits), its name (a field), Delete at the bottom (asked when it's on pages) -->
@if (tag(); as t) {
  <div class="flex min-h-full flex-col gap-6 px-4 pt-2 pb-24">
    <div class="flex flex-col gap-2">
      <span class="px-row-x text-body font-semibold text-fg-secondary">{{ 'tags.pagesOf' | t }}</span>
      <ui-list>
        @for (page of pages(); track page.id) {
          <button type="button" uiListItem icon="page" [tint]="tint(t)" chevron (click)="openPage(page.id)">{{ page.title }}</button>
        } @empty {
          <div uiListItem><span class="text-fg-secondary">{{ 'tags.noPages' | t }}</span></div>
        }
      </ui-list>
    </div>

    <ui-list>
      <!-- (its color: the row shows it; a tap — the wheel under it) -->
      <button type="button" uiListItem (click)="wheelOpen.set(!wheelOpen())" [attr.aria-expanded]="wheelOpen()">
        {{ 'tags.color' | t }}
        <span itemValue class="flex items-center gap-2 text-fg-secondary" [class.text-accent]="wheelOpen()">
          <ui-tag-swatch [color]="t.color" class="size-4" />
          {{ colorLabel(t.color) | t }}
        </span>
      </button>
      @if (wheelOpen()) {
        <div class="py-2">
          <ui-wheel [options]="colorOptions()" [value]="t.color" (valueChange)="recolor(t, $event)" [label]="'tags.color' | t" />
        </div>
      }
      <!-- (its name: Enter or away — saved) -->
      <div uiListItem>
        {{ 'tags.name' | t }}
        <input
          #name
          itemValue
          type="text"
          maxlength="40"
          enterkeyhint="done"
          [value]="t.name"
          (keydown.enter)="name.blur()"
          (blur)="rename(t, name)"
          class="w-40 bg-transparent text-right text-body text-fg-secondary outline-none"
        />
      </div>
    </ui-list>

    <ui-list class="mt-auto">
      <button type="button" uiListItem icon="trash" danger (click)="remove(t, $event)">{{ 'tags.delete' | t }}</button>
    </ui-list>
  </div>
}
