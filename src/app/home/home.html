<!-- The choosers: a day, a time, a choice of a few -->
<div class="flex flex-col gap-2 px-4 pt-4 desktop:px-6 desktop:pt-8">
  <ui-list-title>{{ 'home.choosers' | t }}</ui-list-title>
  <div class="flex flex-wrap items-center gap-2">
    <ui-date [(value)]="day" />
    <ui-time [(value)]="time" />
    <ui-select [options]="levels" [(value)]="level" [label]="'home.level' | t" />
    <ui-select [options]="sections()" [(value)]="section" />
  </div>
</div>

<div class="grid grid-cols-[repeat(auto-fill,minmax(8rem,1fr))] gap-3 px-4 py-4 desktop:px-6 desktop:py-8">
  @for (name of icons; track name) {
    <div class="flex flex-col items-center gap-3 rounded-card border-[0.5px] border-separator px-2 py-4">
      <div class="flex items-end gap-4">
        <app-icon [name]="name" class="size-6.5" />
        <app-icon [name]="name" class="size-12" />
      </div>
      <span class="text-footnote text-fg-secondary">{{ name }}</span>
    </div>
  }
</div>
