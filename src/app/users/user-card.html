@if (user(); as user) {
  @if (store.saveError()) {
    <p class="px-row-x text-body text-danger" role="alert">{{ 'users.saveError' | t }}</p>
  }
  <div class="flex flex-col gap-6">
    <!-- Who: the email, the last sign-in -->
    <ui-list>
      <div uiListItem icon="person">{{ user.email }}</div>
      <div uiListItem>
        {{ 'users.lastSignIn' | t }}
        <span itemValue class="text-fg-secondary">{{ store.lastSignIn(user) }}</span>
      </div>
    </ui-list>

    <!-- Their access: a row per area, switched right there (the admins: locked) -->
    <div class="flex flex-col gap-1.5">
      <span class="flex items-center gap-1.5 px-row-x text-footnote font-medium text-fg-secondary">
        <app-icon name="lock" class="size-4" />
        {{ (user.isAdmin ? 'users.locked' : 'users.access') | t }}
      </span>
      <ui-list>
        @for (area of store.areas(); track area) {
          <div uiListItem>
            {{ areaLabels[area] | t }}
            <ui-toggle itemValue
              [checked]="store.has(user, area)" (checkedChange)="store.set(user, area, $event)" [disabled]="user.isAdmin" [label]="(areaLabels[area] | t) + ': ' + user.email" />
          </div>
        }
      </ui-list>
    </div>
  </div>
}
