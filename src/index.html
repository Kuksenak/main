<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>App</title>
  <base href="/">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbf9">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "default", not "black-translucent": with a translucent status bar iOS launches home-screen
       apps with a viewport one status-bar height short (a blank strip at the bottom until the
       phone is rotated) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    (function () {
      var query = window.matchMedia('(prefers-color-scheme: dark)');
      // The theme follows the system. The status bar's color: two theme-color tags, one per scheme
      // (media) — iOS picks the right one by itself as the system switches, nothing to edit then.
      // They're put in anew (nudged: a hair off, then right a moment later) at every switch, when
      // the app comes back, and as anything over the whole screen closes ('theme-color' event:
      // core/services/theme-color.ts) — iOS kept the old color now and then otherwise.
      var LIGHT = '#fbfbf9', DARK = '#000000';
      function tags(light, dark) {
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.remove(); });
        [['light', light], ['dark', dark]].forEach(function (t) {
          var meta = document.createElement('meta');
          meta.name = 'theme-color';
          meta.media = '(prefers-color-scheme: ' + t[0] + ')';
          meta.content = t[1];
          document.head.appendChild(meta);
        });
      }
      function apply(isDark, nudge) {
        document.documentElement.classList.toggle('dark', isDark);
        if (!nudge) return tags(LIGHT, DARK);
        tags('#fbfbfa', '#010101');
        // (a frame later — or, hidden, where frames don't come, a moment later)
        var done = false;
        var right = function () { if (!done) { done = true; tags(LIGHT, DARK); } };
        requestAnimationFrame(right);
        setTimeout(right, 60);
      }
      apply(query.matches);
      query.addEventListener('change', function (e) { apply(e.matches, true); });
      document.addEventListener('theme-color', function () { apply(query.matches, true); });
      // Back in the app: the system theme may have changed while it was hidden.
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') apply(query.matches, true);
      });

      var ua = navigator.userAgent;
      var mobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua) ||
                   'ontouchstart' in window ||
                   navigator.maxTouchPoints > 0;
      document.documentElement.dataset.device = mobile ? 'mobile' : 'desktop';

      // Load only this device's stylesheet (separate non-injected bundles from angular.json).
      // document.write keeps it parser-inserted, so it blocks first paint like a normal <link>.
      document.write('<link rel="stylesheet" href="' + (mobile ? 'styles-mobile.css' : 'styles-desktop.css') + '">');

      // iOS Safari only applies :active styles once a touchstart listener exists.
      document.addEventListener('touchstart', function () {}, { passive: true });
    })();
  </script>
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
