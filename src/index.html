<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>App</title>
  <base href="/">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
  <!-- (Safari underlined the account's email as a link: no guessing at emails, phone numbers) -->
  <meta name="format-detection" content="telephone=no, email=no, address=no">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "default", not "black-translucent": with a translucent status bar iOS launches home-screen
       apps with a viewport one status-bar height short (a blank strip at the bottom until the
       phone is rotated) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    (function () {
      var ua = navigator.userAgent;
      var mobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua) ||
                   'ontouchstart' in window ||
                   navigator.maxTouchPoints > 0;
      document.documentElement.dataset.device = mobile ? 'mobile' : 'desktop';

      // Load only this device's stylesheet (separate non-injected bundles from angular.json).
      // document.write keeps it parser-inserted, so it blocks first paint like a normal <link>.
      document.write('<link rel="stylesheet" href="' + (mobile ? 'styles-mobile.css' : 'styles-desktop.css') + '">');

      // The theme follows the system (the page's class), read once as the app starts — a switch
      // later reloads the app (at once; made while the app was away: as it comes back): after a
      // reload iOS always got the status bar right, everything else fell out of step somewhere (see
      // CLAUDE.md). No theme-color tag: iOS colors the bar by the system's theme itself.
      // (Before a reload: 'app-reload' on window — a page saves what's typed.)
      var query = window.matchMedia('(prefers-color-scheme: dark)');
      var root = document.documentElement;
      var started = query.matches;
      root.classList.toggle('dark', started);
      function reloadIfSwitched() {
        if (document.visibilityState === 'hidden' || query.matches === started) return;
        window.dispatchEvent(new Event('app-reload'));
        setTimeout(function () { location.reload(); }, 50);
      }
      query.addEventListener('change', reloadIfSwitched);
      document.addEventListener('visibilitychange', reloadIfSwitched);
      window.addEventListener('pageshow', reloadIfSwitched);

      // Desktops (an installed app's window): its title bar's color (theme-color), not the system's
      // gray — the window's one color (--title-bar): the system's bar when shown, our own (as Claude's)
      // when hidden — the window's buttons on it, either way one color with it (desktop.css,
      // components.css). Phones: none, as above. In from the start (a tag put in only at load, the
      // window's buttons kept the system's color), then the computed one at load and at each switch.
      if (!mobile) {
        var wco = navigator.windowControlsOverlay;
        // (a Mac: by its name, or by the window's buttons at the left — the bar's area starting past 0)
        var isMac = function () {
          return /Mac/.test((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent || '') ||
            !!(wco && wco.visible && wco.getTitlebarAreaRect().x > 0);
        };
        var mac = isMac();
        var overlay = window.matchMedia('(display-mode: window-controls-overlay)');
        var meta = document.createElement('meta');
        meta.name = 'theme-color';
        var setMac = function () {
          mac = isMac();
          if (mac) root.dataset.mac = ''; else delete root.dataset.mac;
        };
        setMac();
        meta.content = started ? '#191919' : '#ffffff';
        document.head.appendChild(meta);
        var paint = function () {
          setMac();
          var style = getComputedStyle(root);
          meta.content = style.getPropertyValue('--title-bar').trim() || meta.content;
        };
        window.addEventListener('load', paint);
        overlay.addEventListener('change', paint);
      }

      // iOS Safari only applies :active styles once a touchstart listener exists.
      document.addEventListener('touchstart', function () {}, { passive: true });
    })();
  </script>
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
