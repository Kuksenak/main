<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>App</title>
  <base href="/">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbfbf9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "default", not "black-translucent": with a translucent status bar iOS launches home-screen
       apps with a viewport one status-bar height short (a blank strip at the bottom until the
       phone is rotated) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    (function () {
      var query = window.matchMedia('(prefers-color-scheme: dark)');
      // The theme follows the system. The status bar's color (theme-color, the page's — base.css):
      // a new tag rather than an edited one — iOS didn't notice an edit while a popup was open.
      // Just that: no nudges (another color first) — they made it worse. `again`: the same color
      // put in anew, as anything over the whole screen closes ('theme-color' event:
      // core/services/theme-color.ts).
      function apply(isDark, again) {
        document.documentElement.classList.toggle('dark', isDark);
        var color = isDark ? '#000000' : '#fbfbf9';
        var old = document.querySelector('meta[name="theme-color"]');
        if (old && old.getAttribute('content') === color && !again) return;
        var meta = document.createElement('meta');
        meta.name = 'theme-color';
        meta.content = color;
        if (old) old.replaceWith(meta);
        else document.head.appendChild(meta);
      }
      apply(query.matches);
      query.addEventListener('change', function (e) { apply(e.matches); });
      document.addEventListener('theme-color', function () { apply(query.matches, true); });
      // Back in the app: the system theme may have changed while it was hidden.
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') apply(query.matches);
      });

      var ua = navigator.userAgent;
      var mobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua) ||
                   'ontouchstart' in window ||
                   navigator.maxTouchPoints > 0;
      document.documentElement.dataset.device = mobile ? 'mobile' : 'desktop';

      // Load only this device's stylesheet (separate non-injected bundles from angular.json).
      // document.write keeps it parser-inserted, so it blocks first paint like a normal <link>.
      document.write('<link rel="stylesheet" href="' + (mobile ? 'styles-mobile.css' : 'styles-desktop.css') + '">');

      // iOS Safari only applies :active styles once a touchstart listener exists.
      document.addEventListener('touchstart', function () {}, { passive: true });
    })();
  </script>
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
