<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>App</title>
  <base href="/">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "default", not "black-translucent": with a translucent status bar iOS launches home-screen
       apps with a viewport one status-bar height short (a blank strip at the bottom until the
       phone is rotated) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    (function () {
      var ua = navigator.userAgent;
      var mobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua) ||
                   'ontouchstart' in window ||
                   navigator.maxTouchPoints > 0;
      document.documentElement.dataset.device = mobile ? 'mobile' : 'desktop';

      // Load only this device's stylesheet (separate non-injected bundles from angular.json).
      // document.write keeps it parser-inserted, so it blocks first paint like a normal <link>.
      document.write('<link rel="stylesheet" href="' + (mobile ? 'styles-mobile.css' : 'styles-desktop.css') + '">');

      // The theme follows the system (the page's class). EXPERIMENT: no theme-color tag at all —
      // iOS colors the status bar by the system's theme itself (white / black), nothing of ours
      // to fall out of step. A switch eases the page into its new colors (0.3s, as iOS eases the
      // bar).
      var query = window.matchMedia('(prefers-color-scheme: dark)');
      var root = document.documentElement;
      var easing = 0;
      function apply(ease) {
        var dark = query.matches;
        if (ease && root.classList.contains('dark') !== dark) {
          root.classList.add('theme-easing');
          clearTimeout(easing);
          easing = setTimeout(function () { root.classList.remove('theme-easing'); }, 400);
        }
        root.classList.toggle('dark', dark);
      }
      apply(false);
      query.addEventListener('change', function () { apply(true); });
      document.addEventListener('visibilitychange', function () { apply(false); });

      // iOS Safari only applies :active styles once a touchstart listener exists.
      document.addEventListener('touchstart', function () {}, { passive: true });
    })();
  </script>
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
