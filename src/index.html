<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>App</title>
  <base href="/">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf9f5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin="anonymous">
  <script>
    (function () {
      var query = window.matchMedia('(prefers-color-scheme: dark)');
      function apply(isDark) {
        document.documentElement.classList.toggle('dark', isDark);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', isDark ? '#262624' : '#faf9f5');
      }
      apply(query.matches);
      query.addEventListener('change', function (e) { apply(e.matches); });

      var ua = navigator.userAgent;
      var mobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua) ||
                   'ontouchstart' in window ||
                   navigator.maxTouchPoints > 0;
      document.documentElement.dataset.device = mobile ? 'mobile' : 'desktop';

      // Load only this device's stylesheet (separate non-injected bundles from angular.json).
      // document.write keeps it parser-inserted, so it blocks first paint like a normal <link>.
      document.write('<link rel="stylesheet" href="' + (mobile ? 'styles-mobile.css' : 'styles-desktop.css') + '">');

      // Real app height as --app-h. iOS home-screen apps sometimes report a too-small 100dvh at
      // launch (a blank strip at the bottom until the phone is rotated); window.innerHeight is
      // right, and iOS settles it a moment after launch, so measure again shortly after.
      function setAppHeight() {
        document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
      }
      setAppHeight();
      window.addEventListener('resize', setAppHeight);
      window.addEventListener('orientationchange', setAppHeight);
      window.addEventListener('pageshow', setAppHeight);
      setTimeout(setAppHeight, 300);
      setTimeout(setAppHeight, 1000);

      // Portrait only: lock where the browser allows it (installed PWA on Android). iOS can't
      // lock — the app shows a "rotate your phone" overlay in landscape instead (app.html).
      if (mobile && screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('portrait').catch(function () {});
      }

      // iOS Safari only applies :active styles once a touchstart listener exists.
      document.addEventListener('touchstart', function () {}, { passive: true });
    })();
  </script>
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
