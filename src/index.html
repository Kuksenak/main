<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>App</title>
  <base href="/">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "default", not "black-translucent": with a translucent status bar iOS launches home-screen
       apps with a viewport one status-bar height short (a blank strip at the bottom until the
       phone is rotated) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    (function () {
      var ua = navigator.userAgent;
      var mobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua) ||
                   'ontouchstart' in window ||
                   navigator.maxTouchPoints > 0;
      document.documentElement.dataset.device = mobile ? 'mobile' : 'desktop';

      // Load only this device's stylesheet (separate non-injected bundles from angular.json).
      // document.write keeps it parser-inserted, so it blocks first paint like a normal <link>.
      document.write('<link rel="stylesheet" href="' + (mobile ? 'styles-mobile.css' : 'styles-desktop.css') + '">');

      // The theme follows the system. The status bar's color: one theme-color tag (a new tag, not
      // an edited one — iOS didn't notice an edit while a popup was open).
      // Never switched while the bar's out of sight (the app away; a phone turned sideways, iOS
      // hides the bar): iOS doesn't redraw it then, and back, the tag already said the new color —
      // nothing changed for it, the old color stayed (the "stuck bar"). So such a switch waits till
      // the bar's back in sight: then the tag changes in sight and iOS redraws. And the page eases into the new colors (0.3s, as iOS eases the bar), so the
      // two change together.
      var query = window.matchMedia('(prefers-color-scheme: dark)');
      var root = document.documentElement;
      var shown = null; // the theme the page and the tag have now (null: none yet)
      function tag(color) {
        var old = document.querySelector('meta[name="theme-color"]');
        var meta = document.createElement('meta');
        meta.name = 'theme-color';
        meta.content = color;
        if (old) old.replaceWith(meta);
        else document.head.appendChild(meta);
      }
      var easing = 0;
      // (the bar out of sight: the app away, or a phone turned sideways — iOS hides the bar then)
      var sideways = window.matchMedia('(orientation: landscape) and (max-height: 32rem)');
      function barHidden() {
        return document.visibilityState === 'hidden' || (mobile && sideways.matches);
      }
      function apply(again) {
        if (barHidden()) return; // (out of sight: when it's back)
        var dark = forced !== null ? forced : query.matches;
        if (dark === shown && !again) return;
        if (shown !== null && dark !== shown) {
          // (the page easing into the new colors, as the bar does)
          root.classList.add('theme-easing');
          clearTimeout(easing);
          easing = setTimeout(function () { root.classList.remove('theme-easing'); }, 400);
        }
        shown = dark;
        root.classList.toggle('dark', dark);
        tag(dark ? '#000000' : '#fbfbf9');
      }
      // EXPERIMENT (to watch the status bar follow a switch made in sight): turned sideways, the
      // theme flips — light ↔ dark, whatever the system says (till the app's reloaded); turned
      // back, it stays
      var forced = null;
      sideways.addEventListener('change', function (e) {
        // (sideways: the flip noted — the bar's hidden; upright again: put in, in sight)
        if (e.matches) forced = !(shown !== null ? shown : query.matches);
        else apply();
      });
      apply();
      query.addEventListener('change', function () { forced = null; apply(); });
      document.addEventListener('visibilitychange', function () { apply(); });
      window.addEventListener('pageshow', function () { apply(); });
      // (anything over the whole screen, as it closes: the same color put in anew —
      // core/services/theme-color.ts)
      document.addEventListener('theme-color', function () { apply(true); });

      // iOS Safari only applies :active styles once a touchstart listener exists.
      document.addEventListener('touchstart', function () {}, { passive: true });
    })();
  </script>
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
